<!-- ═══════════════════════════════════════════════════════════════════════
     APEX Sidebar — Orchestrator Template
     Visual markup lives in sub-components and SCSS.
     This template only wires inputs/outputs.
     ═══════════════════════════════════════════════════════════════════════ -->

<aside class="sidebar-panel" role="navigation" aria-label="Main navigation">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <app-sidebar-header [isMini]="layout.isMiniMode()" [isPinned]="layout.isPinned()" [isMobile]="layout.isMobile()"
    (searchOpen)="openSearch()" (togglePin)="layout.togglePin()" (toggleMini)="layout.toggleMiniMode()"
    (closeMobile)="layout.closeMobile()" />

  <!-- ── Navigation scroll area ─────────────────────────────────────────── -->
  <nav class="nav-scroll" aria-label="Site navigation">
    @for (group of menuBuilder.navigationGroups(); track group.groupLabel) {
    <app-sidebar-nav-section [group]="group" [isMini]="layout.isMiniMode()" [expandedKeys]="expandedKeys()"
      [activeParentLabels]="activeParentLabels()" (toggle)="handleToggle($event)" />
    }
  </nav>

  <!-- ── User profile footer ────────────────────────────────────────────── -->
  <app-sidebar-profile [user]="authService.currentUser()" [isMini]="layout.isMiniMode()" (signOut)="logout()" />

</aside>
