<!-- main-screen.html -->
<!--
  STRUCTURE:
    .layout-root
      app-mainscreen-header       ← fixed-height header strip (z: 300)
      .layout-body                ← flex row: sidebar + content
        app-mainscreen-sidebar    ← desktop: absolute/sticky  mobile: fixed (z: 200/500)
        main.main-content         ← scrollable content column (flex: 1)
          router-outlet
      .mobile-backdrop            ← overlay when mobile menu is open (z: 400)
    p-toast                       ← lives outside layout so it's never clipped
-->

<div class="layout-root apex-layout" [class.is-mobile]="layout.isMobile()"
  [class.is-pinned]="layout.isPinned() && !layout.isMobile()">

  <!-- ① Header ─────────────────────────────────────────────────────────── -->
  <app-mainscreen-header (toggleSidebar)="onMenuToggle()"></app-mainscreen-header>

  <!-- ② Body row ───────────────────────────────────────────────────────── -->
  <div class="layout-body">
    <app-mainscreen-sidebar [class.is-pinned]="layout.isPinned()" [class.is-mobile-open]="layout.isMobileMenuOpen()">
    </app-mainscreen-sidebar>

    <div class="content-column">
      <!-- FIXED HUB: Tab Strip stays at the top of the viewport -->
      @if (tabService.tabCount() > 0) {
      <div class="tab-strip-shell">
        <apex-tab-strip></apex-tab-strip>
      </div>
      }

      <!-- SCROLLABLE HUB: Main content area scrolls below the tabs -->
      <main class="main-content" id="main-content">
        <div class="tab-outlet-wrapper">
          <router-outlet></router-outlet>

          <!-- EMPTY STATE: Only shows when no tabs are open -->
          @if (tabService.tabCount() === 0) {
          <div class="tab-empty-state">
            <i class="pi pi-compass"></i>
            <p>Welcome to Apex Infinity. Select an item from the menu to get started.</p>
          </div>
          }
        </div>
      </main>
    </div>

  </div>
  @if (layout.isMobile() && layout.isMobileMenuOpen()) {

  <div class="mobile-backdrop" (click)="layout.closeMobile()"></div>
  }

</div>
<!-- /.layout-root -->

<!-- Toast is outside layout so it's never clipped by overflow:hidden -->
<p-toast position="top-right"></p-toast>
