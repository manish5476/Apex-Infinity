<!-- ─────────────────────────────────────────────────────────────────────────
  tab-strip.component.html
  FIX #3: overflow dropdown menu for 15+ tabs
  FIX #4: mousedown for middle-click (replaces unreliable auxclick)
  ───────────────────────────────────────────────────────────────────────── -->

<nav class="tab-strip" role="tablist" aria-label="Open tabs">

  <!-- Scrollable tab list -->
  <div
    class="tab-strip__scroll"
    #scrollContainer
    (wheel)="onWheelScroll($event)"
  >
    @for (tab of visibleTabs(); track tab.id; let i = $index) {
      <div
        class="tab-item"
        [class.tab-item--active]="tab.active"
        [class.tab-item--pinned]="tab.pinned"
        [class.tab-item--loading]="tab.loading"
        role="tab"
        tabindex="0"
        [attr.aria-selected]="tab.active"
        [attr.title]="tab.label"
        (click)="activateTab(tab.id)"
        (mousedown)="onMouseDown($event, tab.id)"
        (contextmenu)="onContextMenu($event, tab)"
        (keydown.enter)="activateTab(tab.id)"
        (keydown.space)="activateTab(tab.id)"
        draggable="true"
        (dragstart)="onDragStart($event, i)"
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event, i)"
      >
        <!-- Loading shimmer -->
        @if (tab.loading) {
          <span class="tab-item__shimmer"></span>
        }

        <!-- Icon -->
        @if (tab.icon && !tab.loading) {
          <i class="tab-item__icon" [ngClass]="tab.icon"></i>
        }

        <!-- Label -->
        <span class="tab-item__label">{{ tab.label }}</span>

        <!-- Pinned indicator -->
        @if (tab.pinned) {
          <i class="tab-item__pin pi pi-thumbtack"></i>
        }

        <!-- Close button (hidden for pinned) -->
        @if (!tab.pinned) {
          <button
            class="tab-item__close"
            type="button"
            aria-label="Close tab"
            (click)="closeTab($event, tab.id)"
            (mousedown)="$event.stopPropagation()"
          >
            <i class="pi pi-times"></i>
          </button>
        }
      </div>
    }
  </div>

  <!-- Right-side controls -->
  <div class="tab-strip__controls">

    <!-- FIX #3: Overflow dropdown — shown when tabs > OVERFLOW_THRESHOLD -->
    @if (overflowTabs().length > 0) {
      <div class="tab-overflow" #overflowRef>
        <button
          class="tab-ctrl-btn tab-ctrl-btn--overflow"
          type="button"
          [pTooltip]="overflowTabs().length + ' more tabs'"
          tooltipPosition="bottom"
          (click)="toggleOverflow($event)"
          [class.tab-ctrl-btn--active]="overflowOpen()"
        >
          <i class="pi pi-chevron-down"></i>
          <span class="tab-ctrl-btn__badge">{{ overflowTabs().length }}</span>
        </button>

        @if (overflowOpen()) {
          <div class="tab-overflow__menu" (click)="closeOverflow()">
            @for (tab of overflowTabs(); track tab.id) {
              <button
                class="tab-overflow__item"
                [class.tab-overflow__item--active]="tab.active"
                (click)="activateTab(tab.id)"
                type="button"
              >
                @if (tab.icon) {
                  <i class="tab-overflow__item-icon" [ngClass]="tab.icon"></i>
                }
                <span class="tab-overflow__item-label">{{ tab.label }}</span>
                @if (!tab.pinned) {
                  <button
                    class="tab-overflow__item-close"
                    type="button"
                    (click)="closeTab($event, tab.id)"
                    (mousedown)="$event.stopPropagation()"
                    aria-label="Close"
                  >
                    <i class="pi pi-times"></i>
                  </button>
                }
              </button>
            }
          </div>
        }
      </div>
    }

    <button
      class="tab-ctrl-btn"
      type="button"
      pTooltip="Close all tabs"
      tooltipPosition="bottom"
      (click)="closeAll()"
      [disabled]="tabs().length === 0"
    >
      <i class="pi pi-times-circle"></i>
    </button>

  </div>

</nav>

<!-- Context menu (PrimeNG) -->
<p-contextMenu
  #ctxMenu
  [model]="contextMenuItems()"
  appendTo="body"
></p-contextMenu>
