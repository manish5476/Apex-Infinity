<ng-container *hasPermission="PERMISSIONS.AI.CHAT">
<div class="assistant-trigger" (click)="toggleChat()">
  @if (!isOpen) {
    <span>🤖</span>
  }
  @if (isOpen) {
    <span>✖</span>
  }
</div>

@if (isOpen) {
  <div class="chat-window">

    <div class="chat-header">
      <h3>CRM Assistant</h3>
      <span class="status-dot"></span>
    </div>

    <div class="chat-body" #scrollContainer>
      @for (msg of messages; track $index) {
        <div [class.message-user]="msg.sender === 'user'"
          [class.message-bot]="msg.sender === 'bot'">

          <div class="bubble">
            <span [innerHTML]="msg.text"></span>
          </div>
          <div class="time">{{ msg.timestamp | date:'shortTime' }}</div>
        </div>
      }

      @if (isLoading) {
        <div class="message-bot">
          <div class="bubble typing-indicator">
            <span>.</span><span>.</span><span>.</span>
          </div>
        </div>
      }
    </div>

    <div class="chat-footer">
      <input [(ngModel)]="userMessage" (keyup.enter)="sendMessage()" placeholder="Ask about sales, stock..." type="text">
      <button (click)="sendMessage()" [disabled]="isLoading || !userMessage">➤</button>
    </div>
  </div>
}
</ng-container>
