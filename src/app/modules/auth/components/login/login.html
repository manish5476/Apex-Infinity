<app-page>
  <app-floating-split-layout imageSrc="https://images.pexels.com/photos/16846298/pexels-photo-16846298.jpeg"
    imageAlt="Apex Infinity Deep Space" [reverse]="true">

    <!-- ========================================== -->
    <!-- BRAND OVERLAY: Left side                   -->
    <!-- ========================================== -->
    <div brand-overlay class="relative z-10 flex flex-col h-full justify-between text-white">

      <!-- Top: Logo & Brand -->
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center shadow-sm">
          <i class="pi pi-box text-xl"></i>
        </div>
        <span class="text-2xl font-[var(--font-heading)] font-bold tracking-tight">Apex</span>
      </div>

      <!-- Bottom: Hero Content -->
      <div>
        <i class="pi pi-quote-left text-4xl opacity-40 mb-4 block"></i>
        <h2
          class="text-4xl xl:text-5xl text-[var(--color-error)] font-[var(--font-heading)] font-bold leading-tight mb-6 max-w-lg">
          One workspace.<br>
          Endless possibilities.
        </h2>

        <!-- Stats / Indicators -->
        <div class="flex items-center justify-between mt-8">
          <div class="flex items-center gap-4 text-sm font-medium tracking-widest opacity-80">
            <span>Secure</span>
            <span class="w-12 border-b border-white/30"></span>
            <span>Scalable</span>
          </div>
          <div class="flex gap-3">
            <app-status-badge status="active" label="Enterprise" variant="solid" size="sm"></app-status-badge>
          </div>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- LOGIN FORM: Right side                      -->
    <!-- ========================================== -->
    <div class="w-full">

      <!-- Header -->
      <div class="mb-5">
        <h1
          class="text-[length:var(--font-size-4xl)] font-[var(--font-weight-bold)] text-[var(--text-primary)] tracking-tight">
          Sign in
        </h1>
        <p class="text-[length:var(--font-size-md)] text-[var(--text-secondary)] mt-2">
          Welcome back to your workspace
        </p>
      </div>

      <!-- Error Banner -->
      @if (errorMessage()) {
      <div
        class="mb-6 p-4 rounded-[var(--ui-border-radius)] bg-[var(--color-error-bg)] border border-[var(--color-error-border)] flex items-start gap-3 animate-fade-in">
        <i class="pi pi-exclamation-circle text-[var(--color-error)] text-lg mt-0.5"></i>
        <div class="flex-1">
          <p class="text-[length:var(--font-size-sm)] text-[var(--color-error-dark)] m-0 font-medium">
            {{ errorMessage() }}
          </p>
        </div>
        <button type="button"
          class="text-[var(--color-error)] hover:text-[var(--color-error-dark)] transition-colors focus:outline-none"
          (click)="errorMessage.set(null)">
          <i class="pi pi-times"></i>
        </button>
      </div>
      }

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col w-full">

        <!-- Email / Phone -->
        <div class="mb-5">
          <app-field label="Email or Phone" [required]="true" [error]="getFieldError('email')">
            <p-autoComplete formControlName="email" [suggestions]="filteredEmails"
              (completeMethod)="filterEmail($event)" (onFocus)="onFocus('email')" (onBlur)="onBlur()"
              placeholder="name@company.com" styleClass="w-full"
              inputStyleClass="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3"
              panelStyleClass="apex-dropdown" appendTo="body">
            </p-autoComplete>
          </app-field>
        </div>

        <!-- Shop ID -->
        <div class="mb-5">
          <app-field label="Shop ID" [required]="true" [error]="getFieldError('uniqueShopId')">
            <div class="relative">
              <input pInputText type="text" formControlName="uniqueShopId" placeholder="e.g. SHOP-1042"
                (focus)="onFocus('shopId')" (blur)="onBlur()"
                class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3" />
              <a routerLink="/auth/find-shop"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-[length:var(--font-size-xs)] text-[var(--accent-primary)] hover:underline focus:outline-none">
                Find?
              </a>
            </div>
          </app-field>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <app-field label="Password" [required]="true" [error]="getFieldError('password')">
            <p-password formControlName="password" [toggleMask]="true" [feedback]="false" placeholder="••••••••"
              (onFocus)="onFocus('password')" (onBlur)="onBlur()" styleClass="w-full"
              inputStyleClass="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3">
            </p-password>
            <a routerLink="/auth/forgot-password"
              class="block text-right mt-1 text-[length:var(--font-size-xs)] text-[var(--accent-primary)] hover:underline focus:outline-none">
              Forgot password?
            </a>
          </app-field>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center gap-3 mb-8">
          <p-checkbox formControlName="remember" [binary]="true" inputId="remember" styleClass="apex-checkbox">
          </p-checkbox>
          <label for="remember"
            class="text-[length:var(--font-size-sm)] text-[var(--text-secondary)] cursor-pointer select-none">
            Keep me signed in for 30 days
          </label>
        </div>

        <!-- Submit Button -->
        <!-- Submit Button -->
        <app-button type="submit" variant="primary" [label]="isLoading() ? 'Signing in...' : 'Sign in'"
          [icon]="isLoading() ? 'pi pi-spinner pi-spin' : 'pi pi-arrow-right'" iconPosition="right"
          [loading]="isLoading()" [disabled]="loginForm.invalid || isLoading()" class="w-full">
        </app-button>

      </form>

      <div class="mt-3 flex flex-col sm:flex-row items-center justify-between gap-3 w-full">
        <div class="flex items-center gap-1.5">
          <span class="text-[length:var(--font-size-sm)] text-[var(--text-secondary)]">
            No account?
          </span>
          <a routerLink="/auth/signup"
            class="text-[length:var(--font-size-sm)] text-[var(--accent-primary)] font-medium hover:underline transition-colors focus:outline-none">
            Start your free trial
          </a>
        </div>

        <!-- Optional: Keeps the layout balanced -->
        <a routerLink="/auth/forgot-password"
          class="text-[length:var(--font-size-sm)] text-[var(--text-tertiary)] hover:text-[var(--accent-primary)] transition-colors focus:outline-none">
          Need help?
        </a>
      </div>

      <!-- 2. Delivery Portals (Pill container with subtle separation) -->
      <div class="mt-4 pt-3 border-t border-[var(--border-secondary)]">
        <!-- Label -->
        <div class="flex items-center justify-center gap-3 mb-3">
          <span
            class="text-[length:var(--font-size-2xs)] font-semibold text-[var(--text-tertiary)] uppercase tracking-widest">
            Delivery Portals
          </span>
        </div>

        <!-- Portal Links Container -->
        <div class="inline-flex items-center justify-center w-full">
          <div
            class="flex items-center rounded-full bg-[var(--bg-secondary)] px-1.5 py-1.5 border border-[var(--border-secondary)] shadow-sm">
            <a routerLink="/apex-delivery/login"
              class="px-4 py-1.5 text-[length:var(--font-size-xs)] font-medium text-[var(--text-secondary)] hover:text-[var(--accent-primary)] hover:bg-[var(--bg-primary)] rounded-full transition-all duration-200">
              Apex Network
            </a>

            <div class="h-4 w-px bg-[var(--border-secondary)] mx-1" aria-hidden="true"></div>

            <a routerLink="/delivery-agent/login"
              class="px-4 py-1.5 text-[length:var(--font-size-xs)] font-medium text-[var(--text-secondary)] hover:text-[var(--accent-primary)] hover:bg-[var(--bg-primary)] rounded-full transition-all duration-200">
              Store Agent Login
            </a>
          </div>
        </div>
      </div>

    </div>
  </app-floating-split-layout>
</app-page>
<!-- Confirm Dialog -->
<p-confirmDialog key="loginLimitDialog" styleClass="custom-confirm-dialog" appendTo="body">
</p-confirmDialog>
