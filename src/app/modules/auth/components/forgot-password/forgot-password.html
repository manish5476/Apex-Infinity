<app-page>
  <app-floating-split-layout imageSrc="https://images.pexels.com/photos/16846298/pexels-photo-16846298.jpeg"
    imageAlt="Apex Infinity Deep Space" [reverse]="true">

    <!-- ========================================== -->
    <!-- BRAND OVERLAY: Left side                   -->
    <!-- ========================================== -->
    <div brand-overlay class="relative z-10 flex flex-col h-full justify-between text-white">

      <!-- Top: Logo & Brand -->
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center shadow-sm">
          <i class="pi pi-box text-xl"></i>
        </div>
        <span class="text-2xl font-[var(--font-heading)] font-bold tracking-tight">Apex</span>
      </div>

      <!-- Bottom: Hero Content -->
      <div>
        <i class="pi pi-quote-left text-4xl opacity-40 mb-4 block"></i>
        <h2 class="text-4xl xl:text-5xl font-[var(--font-heading)] font-bold leading-tight mb-6 max-w-lg">
          Account<br>
          <em>Recovery.</em>
        </h2>

        <p class="text-[length:var(--font-size-lg)] opacity-80 max-w-md font-light leading-relaxed">
          Don't worry, it happens. We'll verify your identity and get you back into your workspace securely in just a
          few clicks.
        </p>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- FORGOT PASSWORD FORM: Right side            -->
    <!-- ========================================== -->
    <div class="w-full max-w-lg mx-auto lg:mx-0 flex flex-col justify-center min-h-full py-8">

      <!-- Header -->
      <div class="mb-6">
        <h1
          class="text-[length:var(--font-size-4xl)] font-[var(--font-weight-bold)] text-[var(--text-primary)] tracking-tight">
          Forgot Password
        </h1>
        <p class="text-[length:var(--font-size-sm)] text-[var(--text-secondary)] mt-2">
          Enter your registered email and we'll send you a recovery link.
        </p>
      </div>

      <!-- Form -->
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="flex flex-col w-full">

        <!-- Email Field -->
        <div class="mb-6">
          <app-field label="Email Address" [required]="true">
            <input pInputText type="email" formControlName="email" placeholder="you@company.com"
              class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-2.5" />
          </app-field>
        </div>

        <!-- Submit Button -->
        <app-button type="submit" variant="link" [label]="isLoading() ? 'Sending...' : 'Send Reset Link'"
          [icon]="isLoading() ? 'pi pi-spinner pi-spin' : 'pi pi-arrow-right'" iconPosition="right" [loading]="isLoading()"
          [disabled]="forgotForm.invalid || isLoading()" class="w-full">
        </app-button>

      </form>

      <!-- Back to Login -->
      <div class="mt-6 text-center">
        <a routerLink="/auth/login"
          class="inline-flex items-center gap-2 text-[length:var(--font-size-sm)] text-[var(--text-secondary)] hover:text-[var(--accent-primary)] transition-colors font-medium focus:outline-none">
          <i class="pi pi-arrow-left text-[10px]"></i> Back to Login
        </a>
      </div>

    </div>

  </app-floating-split-layout>
</app-page>
