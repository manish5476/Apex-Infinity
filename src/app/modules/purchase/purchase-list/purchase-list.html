<p-toast></p-toast>

<div class="app-container h-full">

  <!-- Standard Header -->
  <div class="container-header">
    <div class="flex align-center gap-3">
      <div class="icon-box bg-primary-light text-primary border-round p-2 flex align-center justify-center">
        <i class="pi pi-shopping-cart text-xl"></i>
      </div>
      <div class="header-titles">
        <h2 class="container-title">Purchase Register</h2>
        <p class="container-subtitle">Manage purchase orders, track supplier invoices, and inventory intake.</p>
      </div>
    </div>

    <div class="header-actions">
      <p-button *hasPermission="PERMISSIONS.PURCHASE.CREATE" label="New Purchase" icon="pi pi-plus" routerLink="create"
        styleClass="p-button-primary">
      </p-button>
    </div>
  </div>

  <div class="container-body flex flex-col h-full gap-4">

    <div class="app-filter-panel">

      <div class="filter-field">
        <label for="invoice">Invoice No</label>
        <input id="invoice" type="text" pInputText [(ngModel)]="purchaseFilter.invoiceNumber"
          (keydown.enter)="applyFilters()" placeholder="Search Invoice" class="w-full" />
      </div>

      <div class="filter-field">
        <label for="supplier">Supplier</label>
        <app-master-dropdown 
          endpoint="suppliers" 
          [(ngModel)]="purchaseFilter.supplierId"
          (onChange)="applyFilters()"
          placeholder="Select Supplier">
        </app-master-dropdown>
      </div>

      <div class="filter-field" style="min-width: 220px;">
        <label for="dateRange">Date Range</label>
        <p-datepicker id="dateRange" [(ngModel)]="purchaseFilter.dateRange" (onSelect)="applyFilters()"
          selectionMode="range" [readonlyInput]="true" placeholder="Select Range" appendTo="body" dateFormat="dd/mm/yy"
          [showIcon]="true" styleClass="w-full" inputStyleClass="w-full">
        </p-datepicker>
      </div>

      <div class="filter-field">
        <label for="status">Order Status</label>
        <p-select appendTo="body" id="status" [options]="statusOptions" [(ngModel)]="purchaseFilter.status"
          (onChange)="applyFilters()" [showClear]="true" placeholder="Any Status" [filter]="true" filterBy="label"
          styleClass="w-full">
        </p-select>
      </div>

      <div class="filter-actions">
        <p-button label="Reset" icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary"
          (onClick)="resetFilters()"></p-button>
      </div>

    </div>

    <div class="flex-1 min-h-0 manish-border-1 border-secondary border-round overflow-hidden">
      <app-ag-share-grid [columns]="column" [data]="data" [actionColumn]="purchaseActionColumn" selectionMode="multiple"
        (gridEvent)="eventFromGrid($event)" style="height: 100%; width: 100%; display: block;">
      </app-ag-share-grid>
    </div>

  </div>
</div>
