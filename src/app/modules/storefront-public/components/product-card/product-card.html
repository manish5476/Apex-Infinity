<div class="card-root" (click)="viewDetails()" tabindex="0">
  <img
    [src]="displayImage"
    [alt]="product.name"
    class="card-image"
    (error)="onImageError()"
  />

  <div class="card-scrim"></div>

  <div class="card-action">
    <button
      class="glass-pill-btn"
      (click)="$event.stopPropagation(); viewDetails()">
      View details
    </button>
  </div>

  <div class="card-content-wrapper">
    <div class="card-footer">
      <h3 class="card-title" [title]="product.name">
        {{ product.name }}
      </h3>
      <span class="card-subtitle">
        {{ product.brand || 'Unknown Brand' }}
      </span>
    </div>

    <div class="card-reveal">
      <p class="card-description">
        {{ product.description || 'Explore the details of this product.' }}
      </p>

      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-value">{{ product.stock?.stockLevel || 0 }}%</span>
          <span class="stat-label">Stock</span>
        </div>

        <div class="stat-divider"></div>

        <div class="stat-item">
          <span class="stat-value">
            {{ product.price?.discounted || product.price?.original || 'N/A' }}
          </span>
          <span class="stat-label">Price</span>
        </div>

        <div class="stat-divider"></div>

        <div class="stat-item">
          <span class="stat-value">{{ product.rating || '4.8' }}</span>
          <span class="stat-label">Rating</span>
        </div>
      </div>
    </div>
  </div>
</div>
