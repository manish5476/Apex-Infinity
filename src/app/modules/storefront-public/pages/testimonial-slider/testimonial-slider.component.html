<!-- testimonial-slider.component.html -->
<section class="ts-root" [ngStyle]="sectionStyle()">
  <div class="ts-container">
    <header class="ts-header">
      <span class="ts-eyebrow">Reviews</span>
      <h2 class="ts-title">{{ cfg().title }}</h2>
    </header>

    <div class="ts-grid">
      @for (item of items(); track item.name; let i = $index) {
      <article class="ts-card" [class.ts-card-featured]="i === 0">

        <!-- Stars -->
        <div class="ts-stars">
          @for (s of stars(item.rating); track s) {
          <i class="pi pi-star-fill ts-star"></i>
          }
        </div>

        <!-- Quote -->
        <blockquote class="ts-quote">"{{ item.text }}"</blockquote>

        <!-- Author -->
        <footer class="ts-author">
          @if (item.avatar) {
          <img [src]="item.avatar" [alt]="item.name" class="ts-avatar" loading="lazy" />
          } @else {
          <div class="ts-avatar-placeholder">
            {{ item.name.charAt(0) }}
          </div>
          }
          <div>
            <div class="ts-name">{{ item.name }}</div>
            @if (item.role) { <div class="ts-role">{{ item.role }}</div> }
          </div>
        </footer>

      </article>
      }
    </div>
  </div>
</section>
