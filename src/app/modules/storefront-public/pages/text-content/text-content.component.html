<section class="section-root" [ngStyle]="sectionStyle()">

  <div class="container-wrapper">

    <div class="content-wrapper" [ngClass]="[maxWidthClass(), alignmentClass(), textClass()]">

      @if (cfg().title) {
      <h2 class="main-title animate-fade-up">
        {{ cfg().title }}
      </h2>
      }

      @if (cfg().content) {
      <div class="prose animate-fade-up delay-1" [innerHTML]="cfg().content">
      </div>
      }

    </div>

  </div>
</section>
