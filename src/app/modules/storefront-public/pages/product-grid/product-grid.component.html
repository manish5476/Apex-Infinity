<section class="section-root" [ngStyle]="sectionStyle()">

  <div class="container mx-auto" [class.px-4]="true" [class.max-w-7xl]="true">

    <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">

      <div class="w-full text-center md:text-left">
        <h2 class="text-3xl md:text-5xl font-serif font-bold text-slate-900 leading-tight animate-fade-in-up delay-100">
          {{ cfg().title }}
        </h2>
      </div>

    </div>
    <div class="product-grid-layout" [style.--desktop-cols]="cfg().columns"
      [style.--gap]="cfg().gap === 'lg' ? '40px' : (cfg().gap === 'sm' ? '16px' : '24px')">

      @for (product of products; track product.slug || $index; let i = $index) {

      <div class="grid-item" [style.animation-delay]="(i * 50) + 'ms'">
        <app-product-card [product]="product" [orgSlug]="orgSlug" (addToCart)="handleAddToCart($event)">
        </app-product-card>
      </div>

      } @empty {
      <div
        class="col-span-full py-32 flex flex-col items-center justify-center text-center bg-slate-50 rounded-3xl border border-dashed border-slate-200">
        <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-sm mb-6">
          <i class="pi pi-box text-3xl text-slate-300"></i>
        </div>
        <h3 class="font-serif text-2xl text-slate-800 mb-2">No products found</h3>
        <p class="text-slate-500 max-w-md mx-auto">We couldn't find what you're looking for. Try adjusting your filters.
        </p>
      </div>
      }

    </div>

    @if (cfg().pagination && products.length > 0) {
    <div class="mt-20 flex justify-center">
      <button
        class="px-10 py-4 bg-slate-900 text-white rounded-full text-xs font-bold uppercase tracking-[0.15em] hover:bg-slate-800 hover:scale-105 transition-all shadow-lg shadow-slate-900/20">
        Load More Products
      </button>
    </div>
    }

  </div>
</section>
