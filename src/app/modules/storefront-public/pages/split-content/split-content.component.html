<section class="section-root" [ngStyle]="sectionStyle()">
  
  <div class="container-wrapper">
    
    <div class="split-grid" [class.layout-right]="cfg().imagePosition === 'right'">
      
      <div class="text-col animate-fade-up align-left">
        
        <h2 class="title">{{ cfg().title }}</h2>
        
        <div class="description" [innerHTML]="cfg().content"></div>

        @if (cfg().ctaButton?.text && cfg().ctaButton?.link) {
          <div class="cta-wrapper mt-8">
            <a [attr.href]="isExternalLink(cfg().ctaButton!.link) ? cfg().ctaButton!.link : null"
               [routerLink]="!isExternalLink(cfg().ctaButton!.link) ? getLink(cfg().ctaButton!.link) : null"
               [target]="isExternalLink(cfg().ctaButton!.link) ? '_blank' : '_self'"
               class="cta-btn"
               [ngClass]="'variant-' + (cfg().ctaButton!.variant || 'primary')">
              
              @if (cfg().ctaButton!.icon) { <i [class]="'pi ' + cfg().ctaButton!.icon"></i> }
              {{ cfg().ctaButton!.text }} 
              
              @if (!cfg().ctaButton!.icon) { <i class="pi pi-arrow-right" style="font-size: 0.8em"></i> }
            </a>
          </div>
        }
      </div>

      <div class="media-col animate-fade-up delay-1">
        
        <div class="decoration-pattern"></div>
        
        <div class="image-wrapper">
          <img [src]="cfg().image || 'https://via.placeholder.com/800x600'" 
               [alt]="cfg().title" 
               loading="lazy">
        </div>

      </div>

    </div>

  </div>
</section>
