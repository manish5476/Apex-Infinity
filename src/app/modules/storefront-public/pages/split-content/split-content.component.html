<section class="section-root relative overflow-hidden" [ngStyle]="backgroundStyle()">
  
  <div class="absolute inset-0 bg-black/20 z-0"></div>

  <div class="container relative z-10 px-6 md:px-12 mx-auto"
       [class.max-w-7xl]="config.containerWidth === 'standard'"
       [class.max-w-full]="config.containerWidth === 'full'">

    <div class="flex flex-col gap-12 lg:gap-20 items-center" 
         [ngClass]="layoutClass()">

      <div class="w-full lg:w-1/2 relative group">
        <div class="image-frame aspect-[4/3] rounded-[2rem] overflow-hidden shadow-2xl relative z-10 transform transition-transform duration-700 hover:scale-[1.02]">
          <img [src]="config.image || 'https://via.placeholder.com/800x600'" 
               [alt]="config.title"
               class="w-full h-full object-cover"
               loading="lazy">
          
          <div class="absolute inset-0 bg-gradient-to-tr from-white/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
        </div>
        
        <div class="absolute -inset-4 bg-white/10 blur-2xl rounded-[3rem] -z-10 scale-95 group-hover:scale-105 transition-transform duration-700"></div>
      </div>

      <div class="w-full lg:w-1/2">
        <div class="text-card p-8 md:p-12 rounded-[2rem] bg-white/90 backdrop-blur-xl border border-white/20 shadow-xl">
          
          @if (config.subtitle) {
            <span class="block text-xs font-bold uppercase tracking-[0.2em] text-rose-500 mb-4 animate-fade-up">
              {{ config.subtitle }}
            </span>
          }

          @if (config.title) {
            <h2 class="font-serif text-3xl md:text-5xl font-bold text-slate-900 leading-[1.1] mb-6 animate-fade-up delay-100">
              {{ config.title }}
            </h2>
          }

          @if (config.content) {
            <div class="prose text-slate-600 text-lg leading-relaxed mb-8 animate-fade-up delay-200"
                 [innerHTML]="config.content">
            </div>
          }

          @if (config.ctaText && config.ctaUrl) {
            <div class="animate-fade-up delay-300">
              @if (isExternalLink(config.ctaUrl)) {
                <a [href]="config.ctaUrl" 
                   target="_blank"
                   class="inline-flex items-center gap-3 px-8 py-4 bg-slate-900 text-white rounded-full text-xs font-bold uppercase tracking-widest hover:bg-slate-800 hover:scale-105 transition-all shadow-lg">
                  {{ config.ctaText }} <i class="pi pi-external-link"></i>
                </a>
              } @else {
                <a [routerLink]="getLink(config.ctaUrl)" 
                   class="inline-flex items-center gap-3 px-8 py-4 bg-slate-900 text-white rounded-full text-xs font-bold uppercase tracking-widest hover:bg-slate-800 hover:scale-105 transition-all shadow-lg">
                  {{ config.ctaText }} <i class="pi pi-arrow-right"></i>
                </a>
              }
            </div>
          }

        </div>
      </div>

    </div>

  </div>
</section>
