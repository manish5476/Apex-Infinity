<section class="section-root" [ngStyle]="backgroundStyle()">
  
  <div class="container-wrapper">

    <div #container class="stats-grid">
      
      @for (stat of config.stats; track $index) {
        <div class="stat-card animate-in" 
             [style.animation-delay]="($index * 100) + 'ms'">
          
          @if (stat.icon) {
            <i [class]="'pi ' + stat.icon + ' decorative-icon'"></i>
          }

          <div class="number-group">
            <span class="value">{{ displayValues()[$index] }}</span>
            <span class="suffix">{{ stat.suffix }}</span>
          </div>
          
          <p class="label">
            {{ stat.label }}
          </p>

        </div>
      }

    </div>

  </div>
</section>
