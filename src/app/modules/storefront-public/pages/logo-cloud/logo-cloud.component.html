<section class="section-root" 
         [ngStyle]="sectionStyle()"
         [class.text-white]="isDark()"
         [class.text-dark]="!isDark()">
  
  <div class="container-wrapper" 
       [class.standard]="cfg().containerWidth === 'standard'"
       [class.full]="cfg().containerWidth === 'full'">

    <!-- Header Section -->
    @if (cfg().title) {
    <div class="header-group">
      <h3 class="section-label">
        {{ cfg().title }}
      </h3>
      <div class="divider-line"></div>
    </div>
    }

    <!-- Logo Grid -->
    <div class="logo-grid" 
         [class.gap-sm]="cfg().gap === 'sm'"
         [class.gap-md]="cfg().gap === 'md'"
         [class.gap-lg]="cfg().gap === 'lg'">
      
      @for (logo of cfg().logos; track logo.id || logo.name) {
        @if (logo.url) {
          <a [attr.href]="isExternal(logo.url) ? logo.url : null"
             [routerLink]="!isExternal(logo.url) ? getLink(logo.url) : null"
             [target]="isExternal(logo.url) ? '_blank' : '_self'"
             [attr.rel]="isExternal(logo.url) ? 'noopener noreferrer' : null"
             class="logo-item group"
             [ngStyle]="logoItemStyle()">
             
             <img [src]="logo.image" [alt]="logo.name" loading="lazy">
          </a>
        } @else {
          <div class="logo-item" [ngStyle]="logoItemStyle()">
            <img [src]="logo.image" [alt]="logo.name" loading="lazy">
          </div>
        }
      }

    </div>

  </div>
</section>
