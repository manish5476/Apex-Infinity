<section class="section-root" [ngStyle]="backgroundStyle()">
  
  <div class="bg-overlay" *ngIf="config.backgroundImage"></div>

  <div class="container relative z-10 mx-auto px-6 md:px-12"
       [class.max-w-7xl]="config.containerWidth === 'standard'"
       [class.max-w-full]="config.containerWidth === 'full'">

    <div class="text-center mb-12" *ngIf="config.title">
      <h3 class="text-sm font-bold uppercase tracking-[0.2em] text-slate-500 mb-6">
        {{ config.title }}
      </h3>
      <div class="w-12 h-0.5 bg-slate-300 mx-auto rounded-full"></div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-8 md:gap-12 items-center justify-items-center">
      
      @for (logo of config.logos; track $index) {
        
      @if (logo.url) {
          <a [attr.href]="isExternal(logo.url) ? logo.url : null"
             [routerLink]="!isExternal(logo.url) ? getLink(logo.url) : undefined"
             [attr.target]="isExternal(logo.url) ? '_blank' : null"
             class="logo-item group transition-all duration-300 transform hover:scale-110"
             [ngStyle]="logoStyle()">
             
             <img [src]="logo.image" 
                  [alt]="logo.name" 
                  class="max-h-12 w-auto object-contain transition-all duration-300 group-hover:filter-none group-hover:opacity-100">
          </a>
        }
        @else {
          <div class="logo-item transition-all duration-300 hover:scale-105"
               [ngStyle]="logoStyle()">
             <img [src]="logo.image" 
                  [alt]="logo.name" 
                  class="max-h-12 w-auto object-contain">
          </div>
        }

      }

    </div>

  </div>
</section>
