<section class="section-root">
  
  <div class="absolute inset-0 opacity-[0.03] pointer-events-none" *ngIf="config.backgroundImage">
    <img [src]="config.backgroundImage" class="w-full h-full object-cover grayscale">
  </div>

  <div class="container-wrapper" 
       [class.standard]="config.containerWidth === 'standard'"
       [class.wide]="config.containerWidth !== 'standard'">
    
    <div class="header-row">
      <div class="title-block">
        <h2 class="section-title">{{ config.title }}</h2>
        <p class="section-desc">Latest insights, trends, and stories curated for you.</p>
      </div>
      
      <a href="#" class="view-all-link hidden md:inline-flex">
        Read the Journal <i class="pi pi-arrow-right" style="font-size: 0.7rem;"></i>
      </a>
    </div>

    <div class="blog-grid">
      
      @for (post of (posts.length ? posts : mockPosts); track $index) {
        <article class="article-card">
          
          <div class="image-container">
            <img [src]="post.image || 'https://via.placeholder.com/600x400'" 
                 [alt]="post.title"
                 class="card-image" loading="lazy">
            
            @if (config.showDate) {
              <div class="date-badge">
                {{ post.date }}
              </div>
            }
          </div>

          <div class="content-body">
            <span class="category-tag">{{ post.category || 'News' }}</span>
            
            <h3 class="card-title">
              {{ post.title }}
            </h3>
            
            <p class="excerpt">
              {{ post.excerpt }}
            </p>
            
            <div>
              <span class="read-more">Read Story</span>
            </div>
          </div>

        </article>
      }

    </div>

    <div class="mt-12 text-center md:hidden">
      <button class="px-8 py-3 border border-slate-200 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-slate-900 hover:text-white transition-colors">
        View All
      </button>
    </div>

  </div>
</section>
