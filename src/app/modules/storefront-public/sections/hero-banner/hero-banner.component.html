<section class="relative min-h-screen flex items-center justify-center overflow-hidden">
  
  <div class="absolute inset-0 z-0">
    <div class="absolute inset-0 bg-cover bg-center transition-transform duration-[20s] ease-linear hover:scale-105"
         [style.background-image]="'url(' + (config.backgroundImage || 'assets/cloud-bg.jpg') + ')'">
    </div>
    <div class="absolute inset-0 bg-gradient-to-b from-blue-900/40 via-blue-800/20 to-slate-900/60 mix-blend-multiply"></div>
  </div>

  <div class="relative z-10 container mx-auto px-6 text-center pt-20">
    
    <div class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md border border-white/20 px-4 py-1.5 rounded-full mb-8 animate-fade-in-up">
      <span class="text-[10px] font-bold text-white uppercase tracking-widest">Limited Time</span>
      <span class="w-px h-3 bg-white/30"></span>
      <span class="text-[10px] text-blue-100 font-medium">$1 for 1 Year</span>
    </div>

    <h1 class="text-5xl md:text-7xl lg:text-8xl font-serif text-white mb-6 leading-tight animate-fade-in-up delay-100">
      {{ config.title || 'Own your wealth.' }}
    </h1>

    <p class="text-lg md:text-xl text-blue-50/90 max-w-2xl mx-auto font-light leading-relaxed mb-10 animate-fade-in-up delay-200">
      {{ config.subtitle || 'Track your spending, investments, net worth and optimize your financial future—all in one place.' }}
    </p>

    <div class="flex justify-center mb-16 animate-fade-in-up delay-300">
      <a [routerLink]="config.ctaButtons?.[0]?.url || '/'" 
         class="group bg-white text-slate-900 px-8 py-4 rounded-full font-bold uppercase tracking-widest text-xs hover:bg-blue-50 transition-all flex items-center gap-2 shadow-xl shadow-blue-900/20">
        {{ config.ctaButtons?.[0]?.text || 'Get Started' }}
        <i class="pi pi-arrow-right group-hover:translate-x-1 transition-transform"></i>
      </a>
    </div>

    <div class="max-w-xl mx-auto relative animate-fade-in-up delay-500 group">
      <div class="absolute inset-0 bg-white/20 backdrop-blur-xl rounded-full border border-white/10 shadow-2xl transition-all group-hover:bg-white/30"></div>
      <div class="relative flex items-center px-6 h-16">
        <input type="text" 
               placeholder="Where am I spending too much?" 
               class="w-full bg-transparent border-none text-white placeholder-white/70 text-lg focus:ring-0 focus:outline-none font-light" />
        <button class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white hover:bg-white hover:text-slate-900 transition-colors">
          <i class="pi pi-arrow-up"></i>
        </button>
      </div>
    </div>

    <!-- <div class="mt-20 flex justify-center gap-12 opacity-60 grayscale animate-fade-in delay-700">
      <div class="text-white text-xs font-bold uppercase tracking-widest border-l-2 border-white/30 pl-4">
        Forbes<br><span class="font-normal opacity-70">Best Budgeting App</span>
      </div>
      <div class="text-white text-xs font-bold uppercase tracking-widest border-l-2 border-white/30 pl-4">
        Fast Company<br><span class="font-normal opacity-70">Most Innovative</span>
      </div>
    </div> -->

  </div>

</section>
