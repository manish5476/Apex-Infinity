<!-- dynamic-page.component.html -->

@if (isLoading()) {
<div class="loader-screen">
  <div class="storefront-skeleton" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <span class="loading-text">Preparing storefront</span>
</div>
}

@if (error()) {
<div class="error-screen" @fadeInUp>
  <div class="error-card">
    <div class="gradient-line"></div>
    <h1 class="error-code">404</h1>
    <div class="separator"></div>
    <p class="error-msg">{{ error() }}</p>
    <a routerLink="/" class="return-btn">
      <i class="pi pi-arrow-left"></i> Return Home
    </a>
  </div>
</div>
}

@if (pageData(); as data) {
<div class="page-wrapper" @staggerFade>
  <main>

    @for (section of data.page.sections; track section.id) {

    @if ((section.config?.isActive ?? section.isActive) !== false) {
    <section [id]="'section-' + section.id" class="section-block section-enter" [ngClass]="{
               'hidden md:block': section.config?.hideOnMobile && !section.config?.hideOnDesktop,
               'block md:hidden': section.config?.hideOnDesktop && !section.config?.hideOnMobile,
               '!hidden': section.config?.hideOnMobile && section.config?.hideOnDesktop
             }" [attr.data-padding-top]="section.config?.paddingTop || section.styles?.paddingTop || 'md'"
      [attr.data-padding-bottom]="section.config?.paddingBottom || section.styles?.paddingBottom || 'md'"
      [attr.data-theme-mode]="section.config?.themeMode || section.styles?.themeMode || 'auto'"
      [style.--sf-section-bg]="section.config?.backgroundColor || section.styles?.backgroundColor || null">

      <app-storefront-section-renderer [section]="section" [orgSlug]="orgSlug" [isDev]="isDev" />
    </section>
    }

    }

  </main>
</div>
}
