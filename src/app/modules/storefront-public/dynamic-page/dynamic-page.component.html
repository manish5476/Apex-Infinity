<!-- dynamic-page.component.html -->

@if (isLoading()) {
<div class="loader-screen">
  <div class="storefront-skeleton" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <span class="loading-text">Preparing storefront</span>
</div>
}

@if (error()) {
<div class="error-screen" @fadeInUp>
  <div class="error-card">
    <div class="gradient-line"></div>
    <h1 class="error-code">404</h1>
    <div class="separator"></div>
    <p class="error-msg">{{ error() }}</p>
    <a routerLink="/" class="return-btn">
      <i class="pi pi-arrow-left"></i> Return Home
    </a>
  </div>
</div>
}

@if (pageData(); as data) {
<div class="page-wrapper" @staggerFade>
  <main>

    @for (section of data.page.sections; track section.id) {

    @if (section.isActive !== false) {
    <!-- ✅ FIX: use section.id — 'position' does not exist on PageSection -->
    <section [id]="'section-' + section.id" class="section-block section-enter">

      <app-storefront-section-renderer
        [section]="section"
        [orgSlug]="orgSlug"
        [isDev]="isDev"
      />
    </section>
    }

    }

  </main>
</div>
}
