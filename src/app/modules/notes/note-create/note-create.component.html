<div class="create-container">

  <header class="page-header">
    <h1 class="page-title">Create New Note</h1>
    <div class="actions">
      <button class="btn-ghost" (click)="noteForm.reset()">Clear</button>
    </div>
  </header>

  <form [formGroup]="noteForm" (ngSubmit)="onSubmit()" class="glass-panel">
    <div class="main-editor">
      <div class="form-group">
        <input type="text" formControlName="title" placeholder="Untitled Note..." class="input-title"
          [class.error]="noteForm.get('title')?.invalid && noteForm.get('title')?.touched">
      </div>

      <div class="type-tabs">
        <label *ngFor="let type of noteTypes" class="type-tab"
          [class.active]="noteForm.get('noteType')?.value === type.value">
          <input type="radio" formControlName="noteType" [value]="type.value" hidden>
          {{ type.label }}
        </label>
      </div>

      <div class="form-group content-wrapper">
        <textarea formControlName="content" placeholder="Start typing your thoughts here..."
          class="input-content"></textarea>
      </div>

      <div class="attachments-area" *ngIf="uploadedAttachments().length > 0">
        <div class="attachment-pill" *ngFor="let file of uploadedAttachments(); let i = index">
          <span class="file-icon">📎</span>
          <span class="file-name">{{ file.fileName }}</span>
          <button type="button" (click)="removeAttachment(i)" class="btn-remove">×</button>
        </div>
      </div>
    </div>

    <div class="sidebar">

      <div class="sidebar-section">
        <label class="section-label">Priority</label>
        <div class="priority-grid">
          <label *ngFor="let p of priorities" class="priority-option"
            [class.selected]="noteForm.get('priority')?.value === p" [class]="p">
            <input type="radio" formControlName="priority" [value]="p" hidden>
            <span class="dot"></span> {{ p | titlecase }}
          </label>
        </div>
      </div>

      <div class="sidebar-section">
        <label class="section-label">Schedule</label>
        <div class="date-group">
          <div class="input-wrapper">
            <span class="input-icon">📅</span>
            <input type="date" formControlName="startDate" class="input-date" placeholder="Start">
          </div>
          <div class="input-wrapper">
            <span class="input-icon">🏁</span>
            <input type="date" formControlName="dueDate" class="input-date" placeholder="Due">
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <label class="section-label">Tags</label>
        <input type="text" formControlName="tags" placeholder="frontend, bug, v2 (comma separated)" class="input-std">
      </div>

      <div class="sidebar-section" *ngIf="noteForm.get('noteType')?.value === 'meeting'" formGroupName="meetingDetails">
        <label class="section-label">Meeting Details</label>
        <input type="text" formControlName="location" placeholder="📍 Location / Room" class="input-std mb-2">
        <input type="text" formControlName="link" placeholder="🔗 Video Link" class="input-std">
      </div>

      <div class="sidebar-section upload-section">
        <label class="btn-upload" [class.loading]="isUploading()">
          <input type="file" multiple (change)="onFileSelected($event)" hidden>
          <span *ngIf="!isUploading()">📎 Upload Files</span>
          <span *ngIf="isUploading()">⏳ Uploading...</span>
        </label>
      </div>

      <div class="sidebar-footer">
        <button type="submit" class="btn-primary" [disabled]="isSubmitting() || isUploading()">
          {{ isSubmitting() ? 'Saving...' : 'Create Note' }}
        </button>
      </div>
    </div>
  </form>
</div>
