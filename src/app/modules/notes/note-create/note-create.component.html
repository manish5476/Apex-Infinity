<div class="create-container">

  <header class="page-header">
    <h1 class="page-title">Create New Note</h1>
    <div class="actions">
      <button class="btn-ghost" (click)="noteForm.reset()">Clear</button>
    </div>
  </header>

  <form [formGroup]="noteForm" (ngSubmit)="onSubmit()" class="glass-panel">
    
    <div class="main-editor">
      <div class="form-group">
        <input type="text" formControlName="title" placeholder="Untitled Note..." class="input-title"
          [class.error]="noteForm.get('title')?.invalid && noteForm.get('title')?.touched">
      </div>

      <div class="type-tabs">
        @for (type of noteTypes; track type.value) {
          <label class="type-tab" [class.active]="noteForm.get('noteType')?.value === type.value">
            <input type="radio" formControlName="noteType" [value]="type.value" hidden>
            {{ type.label }}
          </label>
        }
      </div>

      <div class="form-group content-wrapper">
        <textarea formControlName="content" placeholder="Start typing your thoughts here..."
          class="input-content"></textarea>
      </div>

      @if (uploadedAttachments().length > 0) {
        <div class="attachments-area">
          @for (file of uploadedAttachments(); track file; let i = $index) {
            <div class="attachment-pill">
              <span class="file-icon">📎</span>
              <span class="file-name">{{ file.fileName }}</span>
              <button type="button" (click)="removeAttachment(i)" class="btn-remove">×</button>
            </div>
          }
        </div>
      }
    </div>

    <div class="sidebar">

      <div class="sidebar-section">
        <label class="section-label">Priority Level</label>
        <div class="priority-grid">
          @for (p of priorities; track p) {
            <label class="priority-option" [class.selected]="noteForm.get('priority')?.value === p" [class]="p">
              <input type="radio" formControlName="priority" [value]="p" hidden>
              <span class="dot"></span> {{ p | titlecase }}
            </label>
          }
        </div>
      </div>

      <div class="sidebar-section">
        <label class="section-label">Schedule</label>
        <div class="date-group">
          <div class="input-wrapper">
            <p-datepicker 
              formControlName="startDate" 
              placeholder="Start Date" 
              [showIcon]="true"
              dateFormat="dd/mm/yy"
              [showTime]="false"
              appendTo="body"
              styleClass="w-full">
            </p-datepicker>
          </div>
          <div class="input-wrapper">
            <p-datepicker 
              formControlName="dueDate" 
              placeholder="Due Date" 
              [showIcon]="true"
              dateFormat="dd/mm/yy"
              [showTime]="false"
              appendTo="body"
              styleClass="w-full">
            </p-datepicker>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <label class="section-label">Tags & Categorization</label>
        <input type="text" formControlName="tags" placeholder="frontend, bug, v2 (comma separated)" class="input-std">
      </div>

      @if (noteForm.get('noteType')?.value === 'meeting') {
        <div class="sidebar-section" formGroupName="meetingDetails">
          <label class="section-label">Meeting Info</label>
          <input type="text" formControlName="location" placeholder="📍 Location / Room" class="input-std mb-2">
          <input type="text" formControlName="videoLink" placeholder="🔗 Video Link" class="input-std">
        </div>
      }

      <div class="sidebar-section">
        <label class="section-label">Attachments</label>
        <label class="btn-upload" [class.loading]="isUploading()">
          <input type="file" multiple (change)="onFileSelected($event)" hidden>
          @if (!isUploading()) {
            <span>📎 Upload Files</span>
          } @else {
            <span>⏳ Uploading...</span>
          }
        </label>
      </div>

      <div class="sidebar-footer">
        <button type="submit" class="btn-primary" [disabled]="isSubmitting() || isUploading()">
          {{ isSubmitting() ? 'Saving...' : 'Create Note' }}
        </button>
      </div>
    </div>
  </form>
</div>
