<p-toast position="bottom-right" appendTo="body"></p-toast>

<app-page>
  <app-page-header [showToolbar]="false">
    <ng-container header-left>
      <div class="flex flex-row items-center gap-4">
        <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-[var(--bg-secondary)] text-[var(--accent-primary)] border border-[var(--border-primary)] shadow-sm">
          <i class="pi pi-replay text-xl"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-[var(--text-primary)] m-0">Sales Returns</h2>
          <p class="text-sm text-[var(--text-secondary)] m-0 mt-1">Track and manage credit notes &amp; product returns</p>
        </div>
      </div>
    </ng-container>

    <div class="flex items-center gap-2">
      <p-button icon="pi pi-refresh" styleClass="p-button-text p-button-secondary p-button-rounded"
        [loading]="isLoading()" (onClick)="getData(true)" pTooltip="Refresh List"></p-button>

      <p-button *hasPermission="PERMISSIONS.SALES.MANAGE" label="New Sales Return" icon="pi pi-plus"
        styleClass="p-button-primary" routerLink="/invoices"></p-button>
    </div>
  </app-page-header>

  <app-page-content density="compact">
    <div class="flex flex-col h-full gap-4">

      <div class="app-filter-panel">
        
        <div class="filter-field flex-[2] min-w-[300px]">
          <label>Search</label>
          <input type="text" pInputText [formControl]="searchControl" placeholder="Return #, Invoice #..."
            class="w-full" />
        </div>

        <div class="filter-field">
          <label>Status</label>
          <p-select appendTo="body" [options]="statusOptions" [(ngModel)]="filter.status" (onChange)="applyFilters()"
            placeholder="Select Status" styleClass="w-full" [showClear]="true"></p-select>
        </div>

        <div class="filter-field">
          <label>Branch</label>
          <app-master-dropdown endpoint="branches" [(ngModel)]="filter.branchId" (onChange)="applyFilters()"
            placeholder="Select Branch">
          </app-master-dropdown>
        </div>

        <div class="filter-field">
          <label>Date Range</label>
          <p-datepicker [(ngModel)]="filter.dateRange" selectionMode="range" (onSelect)="applyFilters()"
            placeholder="Start - End" styleClass="w-full" inputStyleClass="w-full" appendTo="body" [showIcon]="true"></p-datepicker>
        </div>

        <div class="filter-actions">
          <p-button icon="pi pi-filter-slash" styleClass="p-button-text p-button-rounded p-button-secondary" 
            (onClick)="resetFilters()" pTooltip="Clear Filters">
          </p-button>
        </div>

      </div>

      <div class="flex-1 min-h-0 manish-border-1 border-secondary border-round overflow-hidden">
        <app-data-grid [columns]="column" [data]="data()" (gridEvent)="eventFromGrid($event)" class="full-size-grid" style="height: 100%; width: 100%; display: block;">
        </app-data-grid>
      </div>

    </div>
  </app-page-content>
</app-page>
