<p-toast></p-toast>

<app-page>
  <!-- Standard Header -->
  <app-page-header [showToolbar]="false">
    <ng-container header-left>
      <div class="flex flex-row items-center gap-4">
        <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-[var(--bg-secondary)] text-[var(--accent-primary)] border border-[var(--border-primary)] shadow-sm">
          <i class="pi pi-chart-line text-xl"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-[var(--text-primary)] m-0">Sales Register</h2>
          <p class="text-sm text-[var(--text-secondary)] m-0 mt-1">Manage sales orders, track payments, and analyze revenue.</p>
        </div>
      </div>
    </ng-container>

    <div class="flex items-center gap-2">
      <p-button *hasPermission="PERMISSIONS.SALES.MANAGE" label="New Sale" icon="pi pi-plus" (onClick)="onCreateSales()"
        styleClass="p-button-primary">
      </p-button>
    </div>
  </app-page-header>

  <app-page-content density="compact">
    <div class="flex flex-col h-full gap-4">

      <div class="flex flex-row flex-wrap items-end gap-4 bg-[var(--bg-secondary)] border border-[var(--border-secondary)] rounded-xl p-4 shadow-sm w-full">

        <div class="flex flex-col gap-1 flex-[2] min-w-[300px]">
          <label for="search" class="text-xs font-semibold text-[var(--text-label)] uppercase tracking-wider">Search</label>
          <input id="search" type="text" pInputText [formControl]="searchControl"
            placeholder="Search Invoice # or Customer..." class="w-full" />
        </div>

        <div class="flex flex-col gap-1 flex-1 min-w-[200px]">
          <label for="branch" class="text-xs font-semibold text-[var(--text-label)] uppercase tracking-wider">Branch</label>
          <app-master-dropdown
            endpoint="branches"
            [(ngModel)]="salesFilter.branchId"
            (onChange)="applyFilters()"
            placeholder="All Branches">
          </app-master-dropdown>
        </div>

        <div class="flex flex-col gap-1 flex-1 min-w-[220px]">
          <label for="dateRange" class="text-xs font-semibold text-[var(--text-label)] uppercase tracking-wider">Date Range</label>
          <p-datepicker
            appendTo="body"
            id="dateRange"
            [(ngModel)]="salesFilter.dateRange"
            (onSelect)="applyFilters()"
            selectionMode="range"
            [readonlyInput]="true"
            placeholder="Select Range"
            [showIcon]="true"
            styleClass="w-full"
            inputStyleClass="w-full">
          </p-datepicker>
        </div>

        <div class="flex flex-col gap-1 flex-1 min-w-[200px]">
          <label for="payStatus" class="text-xs font-semibold text-[var(--text-label)] uppercase tracking-wider">Payment Status</label>
          <p-select appendTo="body" id="payStatus" [options]="paymentStatusOptions"
            [(ngModel)]="salesFilter.paymentStatus" [showClear]="true" placeholder="All Status" styleClass="w-full"
            [filter]="true" filterBy="label" (onChange)="applyFilters()">
          </p-select>
        </div>

        <div class="flex flex-col gap-1 flex-1 min-w-[200px]">
          <label for="status" class="text-xs font-semibold text-[var(--text-label)] uppercase tracking-wider">Order Status</label>
          <p-select appendTo="body" id="status" [options]="statusOptions" [(ngModel)]="salesFilter.status"
            [showClear]="true" placeholder="All Orders" styleClass="w-full" [filter]="true" filterBy="label"
            (onChange)="applyFilters()">
          </p-select>
        </div>

        <div class="flex gap-3 ml-auto">
          <p-button icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary" (onClick)="resetFilters()"
            pTooltip="Reset Filters"></p-button>
          <p-button label="Apply" icon="pi pi-filter" (onClick)="applyFilters()"></p-button>
        </div>

      </div>

      <div class="flex-1 min-h-0 manish-border-1 border-secondary border-round overflow-hidden">
        <app-data-grid [viewOnly]="true" [pagination]="true" [enableExport]="true" [columns]="column" [data]="data" selectionMode="multiple" (gridEvent)="eventFromGrid($event)"
          class="full-size-grid" style="height: 100%; width: 100%; display: block;">
        </app-data-grid>
      </div>

    </div>
  </app-page-content>
</app-page>
