<p-toast></p-toast>

<div class="app-container h-full">

  <div class="container-header">
    <div class="flex align-center gap-3">
      <div class="icon-box bg-primary-light text-primary border-round p-2 flex align-center justify-center">
        <i class="pi pi-receipt text-xl"></i>
      </div>
      <div class="header-titles">
        <h2 class="container-title">Invoices</h2>
        <p class="container-subtitle">Manage billing, track payments, and export reports.</p>
      </div>
    </div>

    <div class="header-actions">
      <p-button *hasPermission="PERMISSIONS.INVOICE.EXPORT" label="Export CSV" icon="pi pi-download"
        styleClass="p-button-outlined p-button-secondary" [loading]="isExporting" (onClick)="exportReport()">
      </p-button>

      <p-button *hasPermission="PERMISSIONS.INVOICE.CREATE" label="New Invoice" icon="pi pi-plus" routerLink="create"
        styleClass="p-button-primary">
      </p-button>
    </div>
  </div>

  <div class="container-body flex flex-col h-full gap-4">

    <div class="app-filter-panel">

      <div class="filter-field" style="min-width: 220px;">
        <label for="dateRange">Date Range</label>
        <p-datepicker [(ngModel)]="dateRange" selectionMode="range" [readonlyInput]="true" placeholder="Start - End"
          [showIcon]="true" inputId="dateRange" appendTo="body" (onClose)="applyFilters()" styleClass="w-full"
          inputStyleClass="w-full">
        </p-datepicker>
      </div>

      <div class="filter-field">
        <label for="invoiceNumber">Invoice Number</label>
        <input id="invoiceNumber" type="text" pInputText [(ngModel)]="invoiceFilter.invoiceNumber"
          placeholder="Search number" (keydown.enter)="applyFilters()" class="w-full" />
      </div>

      <div class="filter-field">
        <label for="customer">Customer</label>
        <app-master-dropdown 
          endpoint="customers" 
          [(ngModel)]="invoiceFilter.customerId" 
          (onSelect)="applyFilters()" 
          placeholder="All Customers">
        </app-master-dropdown>
      </div>

      <div class="filter-field">
        <label for="status">Status</label>
        <p-select appendTo="body" id="status" [options]="statusOptions" [(ngModel)]="invoiceFilter.status"
          [showClear]="true" placeholder="All Status" (onChange)="applyFilters()" styleClass="w-full" [filter]="true"
          filterBy="label">
        </p-select>
      </div>

      <div class="filter-field">
        <label for="paymentStatus">Payment</label>
        <p-select appendTo="body" id="paymentStatus" [options]="paymentStatusOptions"
          [(ngModel)]="invoiceFilter.paymentStatus" [showClear]="true" placeholder="All Payments"
          (onChange)="applyFilters()" styleClass="w-full" [filter]="true" filterBy="label">
        </p-select>
      </div>

      <div class="filter-actions">
        <p-button label="Apply" icon="pi pi-check" (onClick)="applyFilters()"></p-button>
        <p-button label="Reset" icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary"
          (onClick)="resetFilters()"></p-button>
      </div>

    </div>

    <div class="flex-1 min-h-0 manish-border-1 border-secondary border-round overflow-hidden">
      <app-ag-share-grid [columns]="column" [data]="data" [actionColumn]="invoiceActionColumn" selectionMode="multiple"
        (gridEvent)="eventFromGrid($event)" style="height: 100%; width: 100%; display: block;">
      </app-ag-share-grid>
    </div>

  </div>
</div>
