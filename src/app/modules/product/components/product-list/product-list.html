<app-page>
  <app-page-header
    title="Product Management"
    subtitle="Manage inventory, prices, and product details.">
    <div header-left>
      <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-[color-mix(in_srgb,var(--accent-primary)_12%,transparent)] text-[var(--accent-primary)] mr-3">
        <i class="pi pi-box text-lg"></i>
      </div>
    </div>
    <div header-right class="flex items-center gap-2.5">
      <!-- Hidden file input -->
      <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" multiple style="display: none;">

      <p-button *hasPermission="PERMISSIONS.PRODUCT.UPDATE" [disabled]="selectedRows().length !== 1"
        label="Upload Image" icon="pi pi-upload" (onClick)="triggerUpload()"
        severity="secondary" [outlined]="true">
      </p-button>

      <p-button *hasPermission="PERMISSIONS.PRODUCT.DELETE" [disabled]="selectedRows().length !== 1"
        label="Delete" icon="pi pi-trash" (onClick)="deleteProduct()"
        severity="danger" [outlined]="true">
      </p-button>

      <p-button *hasPermission="[PERMISSIONS.PRODUCT.CREATE, PERMISSIONS.PRODUCT.UPDATE]"
        [label]="selectedRows().length > 0 ? 'Edit Product' : 'New Product'" icon="pi pi-plus" (onClick)="bulkDialogVisible.set(true)">
      </p-button>
    </div>
  </app-page-header>

  <app-page-content [padded]="true">
    <!-- Sleek Filter Bar -->
    <div class="flex flex-row flex-wrap items-end gap-3 p-3.5 bg-[var(--bg-secondary)] border border-[var(--border-secondary)] rounded-xl shadow-xs w-full mb-3">
      <!-- Product Name -->
      <div class="flex flex-col gap-1.5 flex-[1.4] min-w-[170px]">
        <label class="text-[11px] font-bold text-[var(--text-tertiary)] uppercase tracking-wider pl-0.5">Product Name</label>
        <p-iconField iconPosition="left" class="w-full relative flex items-center">
          <p-inputIcon styleClass="pi pi-search text-[var(--text-tertiary)] text-xs"></p-inputIcon>
          <input
            id="name"
            type="text"
            pInputText
            [ngModel]="productFilter().name"
            (ngModelChange)="patchProductFilter('name', $event)"
            (keydown.enter)="applyFilters()"
            placeholder="Search name..."
            class="w-full h-[38px] text-sm pl-8 pr-3 rounded-lg bg-[var(--bg-primary)] border-[var(--border-secondary)]" />
        </p-iconField>
      </div>

      <!-- SKU -->
      <div class="flex flex-col gap-1.5 flex-1 min-w-[130px]">
        <label class="text-[11px] font-bold text-[var(--text-tertiary)] uppercase tracking-wider pl-0.5">SKU</label>
        <p-iconField iconPosition="left" class="w-full relative flex items-center">
          <p-inputIcon styleClass="pi pi-barcode text-[var(--text-tertiary)] text-xs"></p-inputIcon>
          <input
            id="sku"
            type="text"
            pInputText
            [ngModel]="productFilter().sku"
            (ngModelChange)="patchProductFilter('sku', $event)"
            (keydown.enter)="applyFilters()"
            placeholder="SKU code..."
            class="w-full h-[38px] text-sm pl-8 pr-3 rounded-lg bg-[var(--bg-primary)] border-[var(--border-secondary)]" />
        </p-iconField>
      </div>

      <!-- Brand -->
      <div class="flex flex-col gap-1.5 flex-1 min-w-[140px]">
        <label class="text-[11px] font-bold text-[var(--text-tertiary)] uppercase tracking-wider pl-0.5">Brand</label>
        <app-master-dropdown
          endpoint="brands"
          [ngModel]="productFilter().brandId"
          (ngModelChange)="patchProductFilter('brandId', $event)"
          placeholder="Select Brand">
        </app-master-dropdown>
      </div>

      <!-- Category -->
      <div class="flex flex-col gap-1.5 flex-1 min-w-[140px]">
        <label class="text-[11px] font-bold text-[var(--text-tertiary)] uppercase tracking-wider pl-0.5">Category</label>
        <app-master-dropdown
          endpoint="categories"
          [ngModel]="productFilter().categoryId"
          (ngModelChange)="patchProductFilter('categoryId', $event)"
          placeholder="Select Category">
        </app-master-dropdown>
      </div>

      <!-- Sub-Category -->
      <div class="flex flex-col gap-1.5 flex-1 min-w-[140px]">
        <label class="text-[11px] font-bold text-[var(--text-tertiary)] uppercase tracking-wider pl-0.5">Sub-Category</label>
        <app-master-dropdown
          endpoint="subcategories"
          [extraParams]="{ parentId: productFilter().categoryId }"
          [ngModel]="productFilter().subCategoryId"
          (ngModelChange)="patchProductFilter('subCategoryId', $event)"
          placeholder="Select Sub-Category">
        </app-master-dropdown>
      </div>

      <!-- Unit -->
      <div class="flex flex-col gap-1.5 flex-[0.8] min-w-[110px]">
        <label class="text-[11px] font-bold text-[var(--text-tertiary)] uppercase tracking-wider pl-0.5">Unit</label>
        <app-master-dropdown
          endpoint="units"
          [ngModel]="productFilter().unitId"
          (ngModelChange)="patchProductFilter('unitId', $event)"
          placeholder="Select Unit">
        </app-master-dropdown>
      </div>

      <!-- Status -->
      <div class="flex flex-col gap-1.5 flex-[0.8] min-w-[120px]">
        <label class="text-[11px] font-bold text-[var(--text-tertiary)] uppercase tracking-wider pl-0.5">Status</label>
        <p-select
          appendTo="body"
          id="status"
          [options]="[
            { label: 'All Status', value: null },
            { label: 'Active', value: true },
            { label: 'Inactive', value: false }
          ]"
          [ngModel]="productFilter().isActive"
          (ngModelChange)="patchProductFilter('isActive', $event)"
          [showClear]="false"
          placeholder="All Status"
          styleClass="w-full h-[38px] flex items-center rounded-lg bg-[var(--bg-primary)] border-[var(--border-secondary)]">
        </p-select>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2 self-end h-[38px] shrink-0">
        <p-button
          label="Apply"
          icon="pi pi-filter"
          (onClick)="applyFilters()"
          styleClass="h-[38px] px-4 rounded-lg shadow-xs font-semibold">
        </p-button>
        <p-button
          label="Reset"
          icon="pi pi-refresh"
          severity="secondary"
          [text]="true"
          (onClick)="resetFilters()"
          styleClass="h-[38px] px-3 rounded-lg text-[var(--text-secondary)] hover:bg-[var(--bg-hover)]">
        </p-button>
      </div>
    </div>

    <app-data-grid [viewOnly]="true" [columns]="column()" [data]="data()" selectionMode="multiple"
      (gridEvent)="eventFromGrid($event)">
    </app-data-grid>
  </app-page-content>
</app-page>

<p-dialog [modal]="true" appendTo="body" [visible]="bulkDialogVisible()" (visibleChange)="bulkDialogVisible.set($event)"
  [modal]="true" header="Bulk Product Editor" styleClass="bulk-dialog p-dialog-full" [draggable]="false"
  [resizable]="false" [maximizable]="true" [blockScroll]="true" [breakpoints]="{'1199px': '75vw', '575px': '90vw'}"
  [dismissableMask]="true">

  <app-bulk-product-entry [selectedData]="selectedRows()"></app-bulk-product-entry>

</p-dialog>

<p-confirmDialog [style]="{width: '450px'}" appendTo="body"
  [breakpoints]="{'1199px': '75vw', '575px': '90vw'}"></p-confirmDialog>
