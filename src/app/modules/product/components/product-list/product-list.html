<div class="app-container h-full">

  <!-- Standard Header -->
  <div class="container-header">
    <div class="flex align-center gap-3">
      <div class="icon-box bg-primary-light text-primary border-round p-2 flex align-center justify-center">
        <i class="pi pi-box text-xl"></i>
      </div>
      <div class="header-titles">
        <h2 class="container-title">Product Management</h2>
        <p class="container-subtitle">Manage inventory, prices, and product details.</p>
      </div>
    </div>

    <div class="header-actions">
      <!-- Hidden file input -->
      <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" multiple style="display: none;">

      <p-button *hasPermission="PERMISSIONS.PRODUCT.UPDATE" [disabled]="selectedRows().length !== 1"
        label="Upload Image" icon="pi pi-upload" (onClick)="triggerUpload()"
        styleClass="p-button-secondary p-button-outlined">
      </p-button>

      <p-button *hasPermission="PERMISSIONS.PRODUCT.DELETE" [disabled]="selectedRows().length !== 1"
        label="Delete Product" icon="pi pi-trash" (onClick)="deleteProduct()"
        styleClass="p-button-danger p-button-outlined">
      </p-button>

      <p-button *hasPermission="PERMISSIONS.PRODUCT.CREATE" label="New Product" icon="pi pi-plus" routerLink="create"
        styleClass="p-button-primary"></p-button>
      <p-button *hasPermission="[PERMISSIONS.PRODUCT.CREATE, PERMISSIONS.PRODUCT.UPDATE]"
        [label]="selectedRows().length > 0 ? 'Edit Product' : 'New Product'" (onClick)="bulkDialogVisible.set(true)"
        styleClass="p-button-primary">
      </p-button>
    </div>
  </div>

  <div class="container-body flex flex-col h-full gap-4">

    <!-- Standard Filter Panel -->
    <div class="app-filter-panel">

      <div class="filter-field" style="flex: 2">
        <label for="name">Product Name</label>
        <input id="name" type="text" pInputText [ngModel]="productFilter().name"
          (ngModelChange)="patchProductFilter('name', $event)" placeholder="Search by name..." class="w-full" />
      </div>

      <div class="filter-field">
        <label for="sku">SKU</label>
        <input id="sku" type="text" pInputText [ngModel]="productFilter().sku"
          (ngModelChange)="patchProductFilter('sku', $event)" placeholder="Search by SKU" class="w-full" />
      </div>

      <div class="filter-field">
        <label for="brand">Brand</label>
        <app-master-dropdown endpoint="brands" [ngModel]="productFilter().brandId"
          (ngModelChange)="patchProductFilter('brandId', $event)" placeholder="Select Brand">
        </app-master-dropdown>
      </div>

      <div class="filter-field">
        <label for="category">Category</label>
        <app-master-dropdown endpoint="categories" [ngModel]="productFilter().categoryId"
          (ngModelChange)="patchProductFilter('categoryId', $event)" placeholder="Select Category">
        </app-master-dropdown>
      </div>

      <div class="filter-field">
        <label for="subcategory">Sub-Category</label>
        <app-master-dropdown endpoint="subcategories"
          [extraParams]="{ parentId: productFilter().categoryId }"
          [ngModel]="productFilter().subCategoryId"
          (ngModelChange)="patchProductFilter('subCategoryId', $event)"
          placeholder="Select Sub-Category">
        </app-master-dropdown>
      </div>

      <div class="filter-field">
        <label for="unit">Unit</label>
        <app-master-dropdown endpoint="units" [ngModel]="productFilter().unitId"
          (ngModelChange)="patchProductFilter('unitId', $event)" placeholder="Select Unit">
        </app-master-dropdown>
      </div>

      <div class="filter-field">
        <label for="status">Status</label>
        <p-select
          appendTo="body"
          id="status"
          [options]="[
            { label: 'All', value: null },
            { label: 'Active', value: true },
            { label: 'Inactive', value: false }
          ]"
          [ngModel]="productFilter().isActive"
          (ngModelChange)="patchProductFilter('isActive', $event)"
          [showClear]="false"
          placeholder="All"
          styleClass="w-full">
        </p-select>
      </div>

      <div class="filter-actions">
        <p-button label="Apply" icon="pi pi-check" (onClick)="applyFilters()"></p-button>
        <p-button label="Reset" icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary"
          (onClick)="resetFilters()"></p-button>
      </div>
    </div>

    <!-- Data Grid Wrapper -->
    <div class="flex-1 min-h-0 manish-border-1 border-secondary border-round overflow-hidden">
      <app-ag-share-grid [columns]="column()" [data]="data()" selectionMode="multiple"
        (gridEvent)="eventFromGrid($event)" style="height: 100%; width: 100%; display: block;">
      </app-ag-share-grid>
    </div>
  </div>
</div>

<p-dialog appendTo="body" [visible]="bulkDialogVisible()" (visibleChange)="bulkDialogVisible.set($event)" [modal]="true"
  header="Bulk Product Editor" styleClass="bulk-dialog p-dialog-full" [draggable]="false" [resizable]="false"
  [maximizable]="true">

  <app-bulk-product-entry [selectedData]="selectedRows()"></app-bulk-product-entry>

</p-dialog>

<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
