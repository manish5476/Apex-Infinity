<div class="app-container h-full">

  <div class="container-header">
    <div class="flex align-center gap-3">
      <div class="icon-box bg-red-100 text-red-600 border-round p-2 flex align-center justify-center">
        <i class="pi pi-exclamation-triangle text-xl"></i>
      </div>
      <div class="header-titles">
        <h2 class="container-title">Low Stock Alert</h2>
        <p class="container-subtitle">Products that are at or below their reorder level.</p>
      </div>
    </div>

    <div class="header-actions">
      <p-button label="Refresh" icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary" (onClick)="refresh()"></p-button>
    </div>
  </div>

  <div class="container-body flex flex-col h-full gap-4">
    <div class="flex-1 min-h-0 manish-border-1 border-secondary border-round overflow-hidden relative">
      @if (isLoading()) {
        <div class="absolute w-full h-full flex align-center justify-center" style="z-index: 10; background: rgba(255,255,255,0.7); inset: 0;">
          <i class="pi pi-spin pi-spinner text-primary" style="font-size: 2rem"></i>
        </div>
      }
      <app-ag-share-grid 
        [columns]="columns" 
        [data]="data"
        style="height: 100%; width: 100%; display: block;">
      </app-ag-share-grid>
    </div>
  </div>

</div>
