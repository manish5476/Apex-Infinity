<p-toast></p-toast>

<app-page>
  <app-page-header title="Supplier Management"
    subtitle="Manage supplier profiles, procurement sources, and contact details.">
    <app-page-actions>
      <p-button *hasPermission="PERMISSIONS.SUPPLIER.CREATE" label="New Supplier" icon="pi pi-plus" routerLink="create"
        styleClass="p-button-primary"></p-button>
    </app-page-actions>
  </app-page-header>

  <app-page-toolbar>
    <div toolbar-left class="flex flex-wrap items-center gap-4 w-full md:w-auto">
      <div class="flex flex-col gap-1 w-full md:w-auto">
        <label for="companyName" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Company
          Name</label>
        <input id="companyName" type="text" pInputText [(ngModel)]="supplierFilter.companyName"
          placeholder="Search by name" class="w-full md:w-48" />
      </div>

      <div class="flex flex-col gap-1 w-full md:w-auto">
        <label for="phone" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Phone</label>
        <input id="phone" type="text" pInputText [(ngModel)]="supplierFilter.phone" placeholder="Search by phone"
          class="w-full md:w-48" />
      </div>

      <div class="flex flex-col gap-1 w-full md:w-auto">
        <label for="search" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Smart Search</label>
        <input id="search" type="text" pInputText [(ngModel)]="supplierFilter.search"
          placeholder="Company, contact, GST, PAN..." class="w-full md:w-64" />
      </div>
    </div>

    <div toolbar-right class="flex items-end gap-2 h-full pb-1">
      <p-button label="Apply" icon="pi pi-check" (onClick)="applyFilters()"></p-button>
      <p-button label="Reset" icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary"
        (onClick)="resetFilters()"></p-button>
    </div>
  </app-page-toolbar>

  <app-page-content>
    <app-card [padded]="false">
      <app-ag-share-grid [columns]="column" [data]="data" [actionColumn]="supplierActionColumn" selectionMode="multiple"
        (gridEvent)="eventFromGrid($event)" style="height: calc(100vh - 280px); width: 100%; display: block;">
      </app-ag-share-grid>
    </app-card>
  </app-page-content>
</app-page>
