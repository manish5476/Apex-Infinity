<p-toast></p-toast>

<div class="app-container h-full">

  <!-- Standard Header -->
  <div class="container-header">
    <div class="flex align-center gap-3">
      <div class="icon-box bg-primary-light text-primary border-round p-2 flex align-center justify-center">
        <i class="pi pi-truck text-xl"></i>
      </div>
      <div class="header-titles">
        <h2 class="container-title">Supplier Management</h2>
        <p class="container-subtitle">Manage supplier profiles, procurement sources, and contact details.</p>
      </div>
    </div>

    <div class="header-actions">
      <p-button *hasPermission="PERMISSIONS.SUPPLIER.CREATE" label="New Supplier" icon="pi pi-plus" routerLink="create"
        styleClass="p-button-primary">
      </p-button>
    </div>
  </div>

  <div class="container-body flex flex-col h-full gap-4">

    <div class="app-filter-panel">

      <!-- Company Name -->
      <div class="filter-field">
        <label for="companyName">Company Name</label>
        <input id="companyName" type="text" pInputText [(ngModel)]="supplierFilter.companyName"
          placeholder="Search by name" class="w-full" />
      </div>

      <!-- Phone -->
      <div class="filter-field">
        <label for="phone">Phone</label>
        <input id="phone" type="text" pInputText [(ngModel)]="supplierFilter.phone" placeholder="Search by phone"
          class="w-full" />
      </div>

      <!-- Actions -->
      <div class="filter-actions">
        <p-button label="Apply" icon="pi pi-check" (onClick)="applyFilters()"></p-button>
        <p-button label="Reset" icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary"
          (onClick)="resetFilters()"></p-button>
      </div>
    </div>

    <div class="flex-1 min-h-0 manish-border-1 border-secondary border-round overflow-hidden">
      <app-ag-share-grid [columns]="column" [data]="data" [actionColumn]="supplierActionColumn" selectionMode="multiple"
        (gridEvent)="eventFromGrid($event)" style="height: 100%; width: 100%; display: block;">
      </app-ag-share-grid>
    </div>

  </div>

</div>
