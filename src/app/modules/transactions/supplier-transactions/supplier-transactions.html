<p-toast></p-toast>

<div class="list-page-container">
  <div class="themed-card">

    <div class="se-filter-bar">
      
      <div class="se-filter-field" style="flex: 1.5;">
        <label for="search">Search</label>
        <div class="p-input-icon-left w-full">
          <i class="pi pi-search"></i>
          <input 
            pInputText 
            id="search"
            type="text" 
            [(ngModel)]="filterParams.search" 
            (keydown.enter)="applyFilters()"
            (blur)="applyFilters()" 
            placeholder="Ref # or Amount..." 
            class="w-full" />
        </div>
      </div>

      <div class="se-filter-field">
        <label>Date Range</label>
        <p-datepicker 
          [(ngModel)]="rangeDates" 
          selectionMode="range" 
          [readonlyInput]="true" 
          placeholder="Select Range"
          [showIcon]="true" 
          appendTo="body" 
          styleClass="w-full" 
          (onClose)="applyFilters()">
        </p-datepicker>
      </div>

      <div class="se-filter-field">
        <label>Type</label>
        <p-select 
          [options]="transactionTypes" 
          [(ngModel)]="filterParams.type" 
          (onChange)="applyFilters()"
          optionLabel="label" 
          optionValue="value" 
          [showClear]="true" 
          placeholder="All Types" 
          appendTo="body"
          [filter]="true"
          filterBy="label"
          styleClass="w-full">
        </p-select>

      </div>

      <div class="se-filter-field">
        <label>Effect</label>
        <p-select 
          [options]="transactionEffects" 
          [(ngModel)]="filterParams.effect" 
          (onChange)="applyFilters()"
          optionLabel="label" 
          optionValue="value" 
          [showClear]="true" 
          placeholder="Credit/Debit" 
          appendTo="body"
          [filter]="true"
          filterBy="label"
          styleClass="w-full">
        </p-select>

      </div>

      <div class="se-filter-actions">
        <p-button 
          icon="pi pi-refresh" 
          styleClass="p-button-outlined p-button-secondary" 
          pTooltip="Reset Filters" 
          (onClick)="resetFilters()">
        </p-button>
        <p-button 
          label="Export" 
          icon="pi pi-download" 
          styleClass="p-button-outlined" 
          (onClick)="exportData()">
        </p-button>
      </div>
    </div>

    <div class="list-grid-wrapper">
      <app-ag-share-grid 
        [columns]="column" 
        [data]="data" 
        [showActions]="false" 
        selectionMode="multiple"
        (gridEvent)="eventFromGrid($event)">
      </app-ag-share-grid>
    </div>

    <div class="footer-stats" style="border-top: 1px solid var(--border-secondary); padding-top: 10px; font-size: 12px; color: var(--text-secondary); text-align: right;">
       Showing {{ data.length }} of {{ totalCount }} transactions
    </div>

  </div>
</div>
