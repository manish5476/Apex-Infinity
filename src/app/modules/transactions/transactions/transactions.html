<p-toast></p-toast>

<app-page>
  <!-- Standard Header -->
  <app-page-header [showToolbar]="false">
    <ng-container header-left>
      <div class="flex flex-row items-center gap-4">
        <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-[var(--bg-secondary)] text-[var(--accent-primary)] border border-[var(--border-primary)] shadow-sm">
          <i class="pi pi-arrow-right-arrow-left text-xl"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-[var(--text-primary)] m-0">Transactions</h2>
          <p class="text-sm text-[var(--text-secondary)] m-0 mt-1">Real-time log of all financial movements.</p>
        </div>
      </div>
    </ng-container>

    <div class="flex items-center gap-2">
      <div class="p-buttongroup mode-toggle">
        <button pButton label="All" 
          [ngClass]="viewMode() === 'all' ? 'p-button-primary' : 'p-button-outlined p-button-secondary'"
          (click)="toggleViewMode('all')"></button>
        <button pButton label="My Entries" 
          [ngClass]="viewMode() === 'mine' ? 'p-button-primary' : 'p-button-outlined p-button-secondary'"
          (click)="toggleViewMode('mine')"></button>
      </div>
      <p-button label="Export" icon="pi pi-download" styleClass="p-button-outlined p-button-secondary" 
        (onClick)="downloadCsv()">
      </p-button>
    </div>
  </app-page-header>

  <app-page-content density="compact">
    <div class="flex flex-col h-full gap-4">

      <div class="flex flex-row flex-wrap items-end gap-4 bg-[var(--bg-secondary)] border border-[var(--border-secondary)] rounded-xl p-4 shadow-sm w-full">

        <div class="flex flex-col gap-1 flex-1 min-w-[200px]">
          <label class="text-xs font-semibold text-[var(--text-label)] uppercase tracking-wider">Date Period</label>
          <p-datepicker [(ngModel)]="rangeDates" selectionMode="range" [readonlyInput]="true" placeholder="Start - End"
            [showIcon]="true" appendTo="body" styleClass="w-full" inputStyleClass="w-full" (onClose)="applyFilters()">
          </p-datepicker>
        </div>

        <div class="flex flex-col gap-1 flex-1 min-w-[200px]">
          <label class="text-xs font-semibold text-[var(--text-label)] uppercase tracking-wider">Transaction Type</label>
          <p-select appendTo="body" [(ngModel)]="filterParams.type" [options]="transactionTypes" [showClear]="true"
            placeholder="All Types" styleClass="w-full" (onChange)="applyFilters()"
            [filter]="true" filterBy="label">
          </p-select>
        </div>

        <div class="flex flex-col gap-1 flex-[2] min-w-[300px]">
          <label class="text-xs font-semibold text-[var(--text-label)] uppercase tracking-wider">Search</label>
          <input type="text" placeholder="Party Name, Ref #..." [(ngModel)]="filterParams.search"
            (keydown.enter)="applyFilters()" pInputText class="w-full" />
        </div>

        <div class="flex gap-3 ml-auto">
          <p-button icon="pi pi-filter-slash" styleClass="p-button-text p-button-rounded p-button-secondary" 
            (onClick)="resetFilters()" pTooltip="Clear Filters">
          </p-button>
        </div>

      </div>

      <div class="flex-1 min-h-0 manish-border-1 border-secondary border-round overflow-hidden">
        <app-data-grid 
          [columns]="column" 
          [data]="data" 
          (gridEvent)="eventFromGrid($event)" 
          style="height: 100%; width: 100%; display: block;">
        </app-data-grid>
      </div>

    </div>
  </app-page-content>
</app-page>
