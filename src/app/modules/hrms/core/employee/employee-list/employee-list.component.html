<p-toast></p-toast>
<p-confirmDialog header="Confirmation" icon="pi pi-exclamation-triangle"></p-confirmDialog>

<div class="app-container h-full">

  <!-- Standard Header -->
  <div class="container-header">
    <div class="flex align-center gap-3">
      <div class="icon-box bg-primary-light text-primary border-round p-2 flex align-center justify-center">
        <i class="pi pi-users text-xl"></i>
      </div>
      <div class="header-titles">
        <h2 class="container-title">User Management</h2>
        <p class="container-subtitle">Manage system users, roles, and access permissions.</p>
      </div>
    </div>

    <div class="header-actions">
      <p-button label="Export" icon="pi pi-download" (onClick)="openExportDialog()"
        styleClass="p-button-secondary p-button-outlined"></p-button>
      <p-button *hasPermission="PERMISSIONS.USER.MANAGE" label="Add User" icon="pi pi-plus" (onClick)="createNew()"
        styleClass="p-button-primary"></p-button>
    </div>
  </div>

  <div class="container-body flex flex-col h-full gap-4">

    <!-- Standard Filter Panel -->
    <div class="app-filter-panel">

      <div class="filter-field">
        <label for="role">Role</label>
        <app-master-dropdown endpoint="roles" [(ngModel)]="userFilter.role" (onChange)="applyFilters()"
          placeholder="Filter by Role">
        </app-master-dropdown>
      </div>

      <div class="filter-field">
        <label for="branch">Branch</label>
        <app-master-dropdown endpoint="branches" [(ngModel)]="userFilter.branchId" (onChange)="applyFilters()"
          placeholder="Filter by Branch">
        </app-master-dropdown>
      </div>

      <div class="filter-field">
        <label for="search">Search</label>
        <input id="search" type="text" pInputText [(ngModel)]="userFilter.search" (keydown.enter)="applyFilters()"
          (blur)="applyFilters()" placeholder="Name or Email..." class="w-full" />
      </div>

      <div class="filter-actions">
        <p-button label="Reset" icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary"
          (onClick)="resetFilters()">
        </p-button>
      </div>

    </div>

    <!-- Data Grid Wrapper -->
    <div class="flex-1 min-h-0 manish-border-1 border-secondary border-round overflow-hidden">
      <app-ag-share-grid [columns]="column" [data]="data" [actionColumn]="userActionColumn" selectionMode="single"
        (gridEvent)="eventFromGrid($event)">
      </app-ag-share-grid>
    </div>

  </div>
</div>
