<p-toast></p-toast>
<p-confirmDialog header="Confirmation" icon="pi pi-exclamation-triangle" appendTo="body" [breakpoints]="{'1199px': '75vw', '575px': '90vw'}"></p-confirmDialog>

<app-page>
  <app-page-header title="User Management" subtitle="Manage system users, roles, and access permissions.">
    <p-button label="Export" icon="pi pi-download" (onClick)="openExportDialog()" styleClass="p-button-secondary p-button-outlined"></p-button>
    <p-button *hasPermission="PERMISSIONS.USER.MANAGE" label="Add User" icon="pi pi-plus" (onClick)="createNew()" styleClass="p-button-primary"></p-button>
  </app-page-header>

  <app-page-content>
    <app-data-grid
      gridId="user-list-grid"
      [data]="data"
      [columns]="column"
      [rowActions]="rowActions"
      [lazy]="true"
      [totalRecords]="totalCount"
      [loading]="isLoading"
      [pagination]="true"
      [pageSize]="pageSize"
      (pageChange)="onPageChange($event)"
      (filterChange)="onFilterChange($event)"
      (sortChange)="onSortChange($event)"
      (searchChange)="onSearchChange($event)"
      (rowClick)="onRowClick($event)"
      (refresh)="onRefresh()">
    </app-data-grid>
  </app-page-content>
</app-page>
