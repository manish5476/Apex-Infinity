<p-toast></p-toast>

<div class="app-container h-full">

  <!-- Standard Header -->
  <div class="container-header">
    <div class="flex align-center gap-3">
      <div class="icon-box bg-primary-light text-primary border-round p-2 flex align-center justify-center">
        <i class="pi pi-calendar text-xl"></i>
      </div>
      <div class="header-titles">
        <h2 class="container-title">EMI Schedules</h2>
        <p class="container-subtitle">Manage and track installment payments and recovery.</p>
      </div>
    </div>

    <div class="header-actions">
       <p-button *hasPermission="PERMISSIONS.EMI.CREATE" label="New EMI Plan" icon="pi pi-plus" routerLink="create"
          styleClass="p-button-primary">
       </p-button>
    </div>
  </div>

  <div class="container-body flex flex-col h-full gap-4">

    <div class="app-filter-panel">

      <div class="filter-field">
        <label for="customer">Customer</label>
        <p-select appendTo="body" (onChange)="applyFilters()" id="customer" [options]="customerOptions()"
          [(ngModel)]="emiFilter.customerId" [filter]="true" filterBy="name" optionLabel="name" optionValue="_id"
          [showClear]="true" placeholder="Filter by Customer" styleClass="w-full">
        </p-select>
      </div>

      <div class="filter-field">
        <label for="status">Status</label>
        <p-select appendTo="body" (onChange)="applyFilters()" id="status" [options]="statusOptions"
          [(ngModel)]="emiFilter.status" optionLabel="label" optionValue="value" [showClear]="true"
          placeholder="Select Status" styleClass="w-full" [filter]="true" filterBy="label">
        </p-select>
      </div>

      <div class="filter-actions ml-auto">
        <p-button label="Reset" icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary"
          (onClick)="resetFilters()"></p-button>
      </div>

    </div>

    <div class="flex-1 min-h-0 overflow-hidden manish-border-1 border-secondary border-round">
      <app-ag-share-grid [columns]="column" [data]="data" [actionColumn]="emiActionColumn" selectionMode="multiple"
        (gridEvent)="eventFromGrid($event)" style="height: 100%; width: 100%; display: block;">
      </app-ag-share-grid>
    </div>

  </div>
</div>
