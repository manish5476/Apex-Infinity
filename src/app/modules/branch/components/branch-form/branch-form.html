<p-toast></p-toast>

<div class="customer-wrapper">
  <section class="customer-container">
    <div class="customer-form-panel">

      <form [formGroup]="branchForm" (ngSubmit)="onSubmit()" class="customer-form-layout">

        <div class="customer-form-header">
          <h1 class="form-title">{{ formTitle() }}</h1>
          <p class="form-subtitle">
            Fill in branch details. <span class="req">*</span> required
          </p>
        </div>

        <div class="customer-form-body custom-scrollbar">

          <section class="form-section">
            <h4 class="section-title">Main Details</h4>

            <div class="form-grid">
              <div class="form-group">
                <label>Branch Name <span class="req">*</span></label>
                <input pInputText formControlName="name" />
              </div>

              <div class="form-group">
                <label>Branch Code</label>
                <input pInputText formControlName="branchCode" placeholder="S-001" />
              </div>

              <div class="form-group">
                <label>Phone Number</label>
                <input pInputText formControlName="phoneNumber" placeholder="+91 9876543210" />
              </div>

              <div class="form-group">
                <label>Manager</label>
                <app-master-dropdown 
                  endpoint="users" 
                  formControlName="managerId" 
                  placeholder="Select Manager">
                </app-master-dropdown>
              </div>
            </div>
          </section>

          <section class="form-section" formGroupName="address">
            <h4 class="section-title">Address</h4>

            <div class="form-grid">
              <div class="form-group col-span-2">
                <label>Street</label>
                <input pInputText formControlName="street" />
              </div>

              <div class="form-group">
                <label>City</label>
                <input pInputText formControlName="city" />
              </div>

              <div class="form-group">
                <label>State</label>
                <input pInputText formControlName="state" />
              </div>

              <div class="form-group">
                <label>Zip Code</label>
                <input pInputText formControlName="zipCode" />
              </div>

              <div class="form-group">
                <label>Country</label>
                <input pInputText formControlName="country" />
              </div>
            </div>
          </section>

          <section class="form-section" formGroupName="location">
            <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
              <h4 class="section-title mb-0 border-none p-0">Location</h4>
              <button type="button" (click)="onLocationFieldFocus()" class="text-xs font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1">
                <i class="pi pi-map-marker"></i> Use Current Location
              </button>
            </div>

            <div class="flex flex-col gap-6">
              
              <app-location-picker 
                [initialLocation]="initialMapLocation()"
                (locationChange)="onMapLocationChange($event)">
              </app-location-picker>

              <div class="form-grid">
                <div class="form-group">
                  <label>Latitude</label>
                  <p-inputNumber formControlName="lat" mode="decimal" [useGrouping]="false" 
                    [minFractionDigits]="6" [maxFractionDigits]="6" placeholder="Select on map">
                  </p-inputNumber>
                </div>

                <div class="form-group">
                  <label>Longitude</label>
                  <p-inputNumber formControlName="lng" mode="decimal" [useGrouping]="false" 
                    [minFractionDigits]="6" [maxFractionDigits]="6" placeholder="Select on map">
                  </p-inputNumber>
                </div>
              </div>
            </div>
          </section>

          <section class="form-section">
            <h4 class="section-title">Settings</h4>

            <div class="flex flex-col gap-4 mt-2">
              <div class="flex items-center gap-3 p-3 border border-dashed border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                <p-checkbox inputId="main" formControlName="isMainBranch" [binary]="true"></p-checkbox>
                <div class="flex flex-col">
                  <label for="main" class="font-bold text-gray-700 cursor-pointer text-sm">Main Branch</label>
                  <span class="text-xs text-gray-500">Is this the headquarters?</span>
                </div>
              </div>

              <div class="flex items-center gap-3 p-3 border border-dashed border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                <p-checkbox inputId="active" formControlName="isActive" [binary]="true"></p-checkbox>
                <div class="flex flex-col">
                  <label for="active" class="font-bold text-gray-700 cursor-pointer text-sm">Active Status</label>
                  <span class="text-xs text-gray-500">Disable to hide this branch temporarily</span>
                </div>
              </div>
            </div>
          </section>

        </div>

        <div class="customer-form-footer">
          <p-button type="submit" icon="pi pi-check" 
            [label]="editMode() ? 'Save Changes' : 'Create Branch'"
            [loading]="isSubmitting()" styleClass="w-full md:w-auto">
          </p-button>
        </div>

      </form>
    </div>
  </section>
</div>
