<p-toast></p-toast>

<app-page>
  <app-page-header>
    <ng-container header-left>
      <div class="flex flex-row items-center gap-4">
        <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-[color-mix(in_srgb,var(--accent-primary)_12%,transparent)] text-[var(--accent-primary)] border border-[var(--border-primary)] shadow-sm">
          <i class="pi pi-building text-xl"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-[var(--text-primary)] m-0">Branch Management</h2>
          <p class="text-sm text-[var(--text-secondary)] m-0 mt-1">View and manage all branch locations.</p>
        </div>
      </div>
    </ng-container>

    <div class="flex items-center gap-2">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input type="text" pInputText [(ngModel)]="branchFilter.name" (keydown.enter)="applyFilters()" placeholder="Search by name..." class="w-64" />
      </span>
      <p-button *hasPermission="PERMISSIONS.BRANCH.MANAGE" label="New Branch" icon="pi pi-plus" routerLink="create"></p-button>
    </div>
  </app-page-header>

  <app-page-content>
    <app-data-grid [viewOnly]="true"  
      [columns]="column" 
      [data]="data" 
      [loading]="isLoading"
      [lazy]="true"
      [totalRecords]="totalCount"
      (pageChange)="onScrolledToBottom()"
      (rowClick)="onRowClick($event)">
    </app-data-grid>
  </app-page-content>
</app-page>
