<p-toast></p-toast>

<app-page>
  <app-page-header title="Branch Management" subtitle="View and manage all branch locations.">
    <ng-container header-left>
      <div class="flex items-center justify-center p-2 rounded-md bg-[var(--color-primary-bg)] text-[var(--accent-primary)]">
        <i class="pi pi-building text-xl"></i>
      </div>
    </ng-container>

    <div class="flex items-center gap-2">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input type="text" pInputText [(ngModel)]="branchFilter.name" (keydown.enter)="applyFilters()" placeholder="Search by name..." class="w-64" />
      </span>
      <p-button *hasPermission="PERMISSIONS.BRANCH.MANAGE" label="New Branch" icon="pi pi-plus" routerLink="create"></p-button>
    </div>
  </app-page-header>

  <app-page-content>
    <app-data-grid 
      [columns]="column" 
      [data]="data" 
      [loading]="isLoading"
      [lazy]="true"
      [totalRecords]="totalCount"
      (pageChange)="onScrolledToBottom()"
      (rowClick)="onRowClick($event)">
    </app-data-grid>
  </app-page-content>
</app-page>
