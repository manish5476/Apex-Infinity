<p-toast></p-toast>

<div class="app-container h-full">

  <!-- Standard Header -->
  <div class="container-header">
    <div class="flex align-center gap-3">
      <div class="icon-box bg-primary-light text-primary border-round p-2 flex align-center justify-center">
        <i class="pi pi-users text-xl"></i>
      </div>
      <div class="header-titles">
        <h2 class="container-title">Customer Management</h2>
        <p class="container-subtitle">Manage customer profiles, contact info, and history.</p>
      </div>
    </div>

    <div class="header-actions">
      <p-button *hasPermission="PERMISSIONS.CUSTOMER.CREATE" label="New Customer" icon="pi pi-plus" routerLink="create"
        styleClass="p-button-primary">
      </p-button>
    </div>
  </div>

  <div class="container-body flex flex-col h-full gap-4">

    <div class="app-filter-panel">

      <div class="filter-field">
        <label for="customer">Customer</label>
        <p-select appendTo="body" (onChange)="applyFilters()" id="customer" [options]="masterList.customers()"
          [(ngModel)]="customerFilter._id" [filter]="true" filterBy="name" optionLabel="name" optionValue="_id"
          [showClear]="true" placeholder="Select Customer" styleClass="w-full">
        </p-select>
      </div>

      <div class="filter-field">
        <label for="email">Email</label>
        <p-autoComplete (onChange)="applyFilters()" id="email" [(ngModel)]="customerFilter.email"
          [suggestions]="emailSuggestions" (completeMethod)="filterEmails($event)" (keyup.enter)="applyFilters()"
          [forceSelection]="false" placeholder="Enter email" styleClass="w-full" inputStyleClass="w-full">
        </p-autoComplete>
      </div>

      <div class="filter-field">
        <label for="phone">Phone</label>
        <input (keydown.enter)="applyFilters()" (blur)="applyFilters()" id="phone" type="text" pInputText
          [(ngModel)]="customerFilter.phone" placeholder="Phone" class="w-full" />
      </div>

      <div class="filter-actions">
        <p-button label="Reset" icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary"
          (onClick)="resetFilters()"></p-button>
      </div>

    </div>

    <div class="flex-1 min-h-0 manish-border-1 border-secondary border-round overflow-hidden">
      <app-ag-share-grid [columns]="column" [data]="data" [actionColumn]="customerActionColumn" selectionMode="multiple"
        (gridEvent)="eventFromGrid($event)" style="height: 100%; width: 100%; display: block;">
      </app-ag-share-grid>
    </div>

  </div>
</div>
