<div class="action-tiles" (mousedown)="$event.stopPropagation()">

  @if (editing) {
    <button pButton class="tile-btn save" pTooltip="Save" tooltipPosition="top" (click)="emit('save')">
      <i class="pi pi-check"></i>
    </button>

    <button pButton class="tile-btn cancel" pTooltip="Cancel" tooltipPosition="top" (click)="emit('cancel')">
      <i class="pi pi-times"></i>
    </button>

  } @else {
    <button pButton class="tile-btn edit" pTooltip="Edit" tooltipPosition="top" (click)="emit('edit')">
      <i class="pi pi-pencil"></i>
    </button>

    <button pButton class="tile-btn delete" pTooltip="Delete" tooltipPosition="top" (click)="emit('delete')">
      <i class="pi pi-trash"></i>
    </button>
  }

</div>
