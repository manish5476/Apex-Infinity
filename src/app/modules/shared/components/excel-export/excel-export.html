<!-- excel-export.component.html -->
<div class="excel-export-wrapper">

  <!-- ── Main Export Button ── -->
  <button type="button" class="export-btn" [class.done]="exportDone()" [class.loading]="exporting()"
    [disabled]="exporting() || !data.length" [title]="tooltipText()" (click)="exportToExcel()">
    <!-- Icon slot -->
    <span class="btn-icon" aria-hidden="true">
      @if (exporting()) {
      <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" stroke-opacity="0.25" />
        <path d="M12 2a10 10 0 0 1 10 10" />
      </svg>
      } @else if (exportDone()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12" />
      </svg>
      } @else {
      <!-- Excel / Download icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="12" y1="11" x2="12" y2="17" />
        <polyline points="9 14 12 17 15 14" />
      </svg>
      }
    </span>

    <!-- Label -->
    <span class="btn-label">
      @if (exporting()) {
      Exporting&hellip;
      } @else if (exportDone()) {
      Downloaded!
      } @else {
      Export Excel
      }
    </span>

    <!-- Row count badge (only in idle state with data) -->
    @if (!exporting() && !exportDone() && rowCount() > 0) {
    <span class="row-badge" aria-label="{{ rowCount() }} rows">
      {{ rowCount() | number }}
    </span>
    }
  </button>

  <!-- ── Meta hint (columns + nested sheets) ── -->
  @if (visibleColumnCount() > 0 && !exporting()) {
  <span class="meta-hint">
    {{ visibleColumnCount() }} col{{ visibleColumnCount() !== 1 ? 's' : '' }}
    @if (nestedSheetCount() > 0) {
    &nbsp;&middot;&nbsp;
    {{ nestedSheetCount() }} ref sheet{{ nestedSheetCount() !== 1 ? 's' : '' }}
    }
  </span>
  }

</div>
