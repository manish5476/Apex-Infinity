<app-page>
  <app-floating-split-layout imageSrc="https://images.pexels.com/photos/16846298/pexels-photo-16846298.jpeg"
    imageAlt="Apex Infinity Deep Space" [reverse]="true">

    <!-- ========================================== -->
    <!-- OVERLAY: Projected into the left side      -->
    <!-- ========================================== -->
    <div brand-overlay class="relative z-10 flex flex-col h-full justify-between text-white">

      <!-- Top Content: Project Name -->
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center shadow-sm">
          <i class="pi pi-box text-xl"></i>
        </div>
        <span class="text-2xl font-[var(--font-heading)] font-bold tracking-tight">Apex Infinity</span>
      </div>

      <!-- Bottom Content: Catchphrase & UI Slider -->
      <div>
        <i class="pi pi-quote-left text-4xl opacity-40 mb-4 block"></i>
        <h2 class="text-4xl xl:text-5xl font-[var(--font-heading)] font-bold leading-tight mb-6 max-w-lg">
          Go anywhere you want in a Galaxy full of wonders!
        </h2>

        <!-- Decorative slider indicators -->
        <div class="flex items-center justify-between mt-8">
          <div class="flex items-center gap-4 text-sm font-medium tracking-widest opacity-80">
            <span>01</span>
            <span class="w-12 border-b border-white/30"></span>
            <span>06</span>
          </div>
          <div class="flex gap-3">
            <button type="button"
              class="w-12 h-12 rounded-full border border-white/30 flex items-center justify-center hover:bg-white/10 transition-colors backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-white/50">
              <i class="pi pi-arrow-left"></i>
            </button>
            <button type="button"
              class="w-12 h-12 rounded-full border border-white/30 flex items-center justify-center hover:bg-white/10 transition-colors backdrop-blur-sm focus:outline-none focus:ring-2 focus:ring-white/50">
              <i class="pi pi-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- FORM WIZARD: Rendered on the right side    -->
    <!-- ========================================== -->
    <div class="w-full max-w-lg mx-auto lg:mx-0 flex flex-col h-full">

      <!-- Header -->
      <div class="mb-10">
        <h1
          class="text-[length:var(--font-size-4xl)] font-[var(--font-weight-bold)] text-[var(--text-primary)] tracking-tight">
          Create Workspace
        </h1>
        <p class="text-[length:var(--font-size-md)] text-[var(--text-secondary)] mt-2">
          Enterprise Ready • Secure • Multi-User
        </p>
      </div>

      <!-- Main Form Wrapper (Height fix applied here) -->
      <form [formGroup]="organizationForm" class="flex flex-col w-full max-w-lg mx-auto lg:mx-0">

        <div class="mb-8">
          <app-tab-bar [tabs]="myTabs" [(activeTabId)]="activeTab"></app-tab-bar>
        </div>

        <!-- Animation Trigger applied to the wrapper -->
        <div class="min-h-[320px] mb-8" [@wizardStep]="currentStepIndex()">

          <!-- STEP 1: ORGANIZATION -->
          @if (currentStepIndex() === 0) {
          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">
            <div class="md:col-span-2">
              <app-field label="Organization Name" [required]="true" [error]="getFieldError('organizationName')">
                <input pInputText type="text" formControlName="organizationName" placeholder="e.g. Shivam Electronics"
                  (blur)="generateShopId()"
                  class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all text-[var(--input-text)] px-4 py-3" />
              </app-field>
            </div>

            <app-field label="Unique Shop ID" [required]="true" [error]="getFieldError('uniqueShopId')">
              <input pInputText type="text" formControlName="uniqueShopId" placeholder="SHIVAM-HQ"
                class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all text-[var(--input-text)] px-4 py-3 uppercase" />
            </app-field>

            <app-field label="GST Number" hint="Optional" [error]="getFieldError('gstNumber')">
              <input pInputText type="text" formControlName="gstNumber" placeholder="22AAAAA0000A1Z5"
                class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all text-[var(--input-text)] px-4 py-3 uppercase" />
            </app-field>

            <app-field label="Primary Email" [required]="true" [error]="getFieldError('primaryEmail')">
              <input pInputText type="email" formControlName="primaryEmail" placeholder="admin@shivamelectronics.com"
                class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all text-[var(--input-text)] px-4 py-3" />
            </app-field>

            <app-field label="Primary Phone" [required]="true" [error]="getFieldError('primaryPhone')">
              <input pInputText type="tel" formControlName="primaryPhone" placeholder="+91 9876543210"
                class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all text-[var(--input-text)] px-4 py-3" />
            </app-field>
          </div>
          }

          <!-- STEP 2: HEADQUARTERS -->
          @if (currentStepIndex() === 1) {
          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">
            <div class="md:col-span-2">
              <app-field label="Branch Name" [required]="true" [error]="getBranchFieldError('mainBranchName')">
                <input pInputText type="text" formControlName="mainBranchName" placeholder="Head Office"
                  class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3" />
              </app-field>
            </div>
          </div>

          <div formGroupName="mainBranchAddress" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5 pt-5">
            <div class="md:col-span-2">
              <app-field label="Street Address" [required]="true" [error]="getBranchFieldError('street')">
                <input pInputText type="text" formControlName="street" placeholder="Main Market Road"
                  class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3" />
              </app-field>
            </div>

            <app-field label="City" [error]="getBranchFieldError('city')">
              <input pInputText type="text" formControlName="city" placeholder="Mumbai"
                class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3" />
            </app-field>

            <div class="grid grid-cols-2 gap-4">
              <app-field label="State" [error]="getBranchFieldError('state')">
                <input pInputText type="text" formControlName="state" placeholder="Maharashtra"
                  class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3" />
              </app-field>

              <app-field label="ZIP / Postal Code" [error]="getBranchFieldError('zipCode')">
                <input pInputText type="text" formControlName="zipCode" placeholder="400001"
                  class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3" />
              </app-field>
            </div>
          </div>
          }

          <!-- STEP 3: SUPER ADMIN -->
          @if (currentStepIndex() === 2) {
          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">
            <app-field label="Full Name" hint="Administrator's name" [error]="getFieldError('ownerName')">
              <input pInputText type="text" formControlName="ownerName" placeholder="Jane Doe"
                class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3" />
            </app-field>

            <app-field label="Login Email" hint="Used for sign in" [error]="getFieldError('ownerEmail')">
              <input pInputText type="email" formControlName="ownerEmail" placeholder="jane@company.com"
                class="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3" />
            </app-field>

            <div class="md:col-span-2 max-w-md pt-2">
              <app-field label="Password" hint="Minimum 8 characters required."
                [error]="getFieldError('ownerPassword')">
                <p-password formControlName="ownerPassword" [toggleMask]="true" [feedback]="true" placeholder="••••••••"
                  styleClass="w-full"
                  inputStyleClass="w-full rounded-[var(--ui-border-radius)] bg-[var(--input-bg)] border border-[var(--input-border)] hover:border-[var(--accent-primary)] focus:bg-[var(--bg-primary)] transition-all px-4 py-3">
                </p-password>
              </app-field>
            </div>
          </div>
          }
        </div>

        <!-- FOOTER (Button rendering fix applied here) -->
        <div class="pt-6 border-t border-[var(--border-secondary)] flex items-center justify-between">
          <app-button variant="ghost" label="Previous" [disabled]="currentStepIndex() === 0 || isLoading()"
            (clicked)="prevStep()">
          </app-button>

          @if (currentStepIndex() < 2) { <app-button variant="primary" label="Continue" icon="pi pi-arrow-right"
            iconPosition="right"
            [disabled]="(currentStepIndex() === 0 && !step1Valid) || (currentStepIndex() === 1 && !step2Valid) || isLoading()"
            (clicked)="nextStep()">
            </app-button>
            } @else {
            <app-button variant="success" [label]="isLoading() ? 'Initializing...' : 'Complete Setup'"
              [icon]="isLoading() ? 'pi pi-spinner pi-spin' : 'pi pi-check'" iconPosition="right"
              [loading]="isLoading()" [disabled]="!step3Valid || isLoading()" (clicked)="onComplete()">
            </app-button>
            }
        </div>
      </form>
    </div>

  </app-floating-split-layout>
</app-page>
