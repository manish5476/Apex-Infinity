<p-toast></p-toast>
<p-confirmDialog header="Confirmation" icon="pi pi-exclamation-triangle"></p-confirmDialog>

<div class="list-page-container">
  
  <div class="list-header" *ngIf="stats()">
    <div class="title-section">
      <div class="icon-box">
        <i class="pi pi-images"></i>
      </div>
      <div class="text-content">
        <h2 class="list-title">Media Vault</h2>
        <p class="list-subtitle">Manage organization assets, storage, and indexing.</p>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon storage-icon">
          <i class="pi pi-server"></i>
        </div>
        <div class="stat-details">
          <span class="label">Total Storage</span>
          <span class="value">{{ stats().totalMB }} <small>MB</small></span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon files-icon">
          <i class="pi pi-copy"></i>
        </div>
        <div class="stat-details">
          <span class="label">Total Files</span>
          <span class="value">{{ stats().totalFiles }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="themed-card list-content-area">
    
    <div class="se-filter-bar">
      <div class="se-filter-field search-field">
        <label for="search">Search</label>
        <span class="p-input-icon-left w-full">
          <input id="search" type="text" pInputText placeholder="File name..." 
                 [(ngModel)]="assetFilter.search" (keydown.enter)="applyFilters()"
                 (blur)="applyFilters()" class="w-full">
        </span>
      </div>

      <div class="se-filter-field">
        <label for="category">Category</label>
        <p-select appendTo="body" (onChange)="applyFilters()" id="category" 
                  [options]="categoryOptions" [(ngModel)]="assetFilter.category" 
                  [showClear]="true" placeholder="Filter by Category" styleClass="w-full">
        </p-select>
      </div>

      <div class="se-filter-actions">
        <p-button label="Reset" icon="pi pi-refresh" styleClass="p-button-outlined p-button-secondary"
                  (onClick)="resetFilters()">
        </p-button>
      </div>

      <div class="se-filter-right">
        <p-button label="Upload File" icon="pi pi-upload" (onClick)="triggerUpload()" styleClass="p-button-primary"></p-button>
      </div>
    </div>

    <div class="list-grid-wrapper">
      <app-ag-share-grid 
        [columns]="column" 
        [data]="data" 
        [showActions]="false"
        selectionMode="single"
        (gridEvent)="eventFromGrid($event)"
        (gridReady)="onGridReady($event)">
      </app-ag-share-grid>
    </div>

  </div>
</div>
